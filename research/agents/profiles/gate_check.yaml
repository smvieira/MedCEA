# Exercise E48: a scripted session whose campaign estimates above mcp-sim's 2 CPU-hour gate
# (6 runs of the 9000-hour fruiting scenario, about 3 CPU-hours), so sim.run answers "waiting for
# the supervisor" until the person who started the session approves or denies gate <cid>.
# Approve with a small cap (c.answer(sid, "gates", gid, "approve", cap_h=0.05)) to see the
# simulation Job stopped at its CPU cap; deny to see the refusal reach the agent.
name: gate_check
backend: scripted
tools: [sim.estimate, sim.run, sim.status, sim.results]
caps:
  turns: 6
  prompt_tokens: 8000
  output_tokens: 800
  cpu_hours: 8
  wall_h: 2
  turn_timeout_s: 30
  context_tokens: 4000
checkpoint_every: 4
script:
  - {text: "Plan: estimate the long campaign.", tool: sim.estimate, args: {spec: {scenarios: [research/harness/scenarios/fungi_pleurotus_fruiting_long.yaml], controllers: [{code: IF_THEN_ELSE}, {code: PID, params_grid: {cycle_time: [10.0, 30.0]}}], seeds: [1, 2], clock_offsets_s: [0]}}}
  - {text: "Plan: run it; above 2 CPU-hours it waits for the supervisor.", tool: sim.run, args: {spec: {scenarios: [research/harness/scenarios/fungi_pleurotus_fruiting_long.yaml], controllers: [{code: IF_THEN_ELSE}, {code: PID, params_grid: {cycle_time: [10.0, 30.0]}}], seeds: [1, 2], clock_offsets_s: [0]}}}
  - {text: "The plan is complete."}
