# fruiting_compare.yaml's grid on the calibrated Pleurotus fruiting scenario: the five
# controllers at their defaults, three seeds, three clock offsets: 5 x 3 x 3 = 45 runs of
# 48 h each (research Phase 3). The sensors publish every ~3 s instead of 30 s, so a run
# costs more than its uncalibrated pair; the campaign's own estimate is in manifest.json.
#
#   research/.venv/bin/python -m research.harness.campaign research/harness/campaigns/fruiting_compare_calibrated.yaml --jobs 12 --max-cpu-hours MAXH
description: five controllers at their defaults on fungi_pleurotus_fruiting_calibrated
scenarios:
  - ../scenarios/fungi_pleurotus_fruiting_calibrated.yaml
controllers:
  - {code: IF_THEN_ELSE}
  - {code: PID}
  - {code: Q_LEARNING}
  - {code: FLC}
  - {code: MPC}
seeds: [1, 2, 3]
clock_offsets_s: [0, 5, 9.99]
