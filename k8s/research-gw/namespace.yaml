# k8s/research-gw/namespace.yaml — the research sandbox's research-gw zone (research Phase 4a, design rs4 R2).
# Applied by infra/deploy-research-gw-namespace.sh. Render list: RESEARCH_GW_NAMESPACE
# The session key and the trace writer (research-session); in 4b the model gateway and the local model. It admits only research-agents and research-gw pods.
# Label medcea/zone marks the zone (network policies select namespaces by the automatic
# kubernetes.io/metadata.name label, never by this one). Pod Security Admission baseline: no
# hostPath volume, no host namespace, no added capability. The namespace's default ServiceAccount
# mounts no token; the one pod that needs the API (the orchestrator, in research-agents) names its own.
apiVersion: v1
kind: Namespace
metadata:
  name: ${RESEARCH_GW_NAMESPACE}
  labels:
    medcea/zone: research-gw
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: baseline
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: ${RESEARCH_GW_NAMESPACE}
  labels:
    medcea/zone: research-gw
automountServiceAccountToken: false
