# The portal's nginx server (ConfigMap portal-nginx, mounted by subPath as
# /etc/nginx/conf.d/default.conf; deploy-infra.sh section 9 writes it, k8s/portal/portal.yaml
# mounts it). Plain file, not a render template: nothing here is substituted.
#
#   /          the portal page (ConfigMap portal-html), as before
#   /images/   the background image apps/frontend/deploy.sh mounts (hostPath)
#   /manual/   the platform manual (ConfigMap portal-manual, infra/lib-manual.sh): stored
#              gzipped only, served with gzip_static always (Content-Encoding: gzip) and
#              decompressed by gunzip for the rare client that does not accept gzip.
#
# Everything here is behind the portal's oauth2-proxy: whoever the policy admits to
# PORTAL_DOMAIN (every platform role) may read the manual.
server {
    listen 80;
    # Redirects stay relative: the pod sees plain http behind the TLS ingress and the proxy,
    # so an absolute one would send the browser to http://.
    absolute_redirect off;

    location /images/ { alias /usr/share/nginx/html/images/; }

    # no-cache: revalidate the page (ETag → 304) so a redeploy is seen at once.
    location / { root /usr/share/nginx/html; index index.html; add_header Cache-Control "no-cache" always; }

    location = /manual { return 301 /manual/; }
    # gzip_static declines a URI ending in "/", so the index is an internal rewrite.
    location = /manual/ { rewrite ^ /manual/index.html last; }
    location = /manual/index.html {
        root /usr/share/nginx;              # /usr/share/nginx/manual/index.html(.gz)
        gzip_static always;
        gunzip on;
        gzip_vary on;
        charset utf-8;                      # Content-Type: text/html; charset=utf-8
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Only the page itself: not index.html.gz or anything else in the mount.
    location /manual/ { return 404; }
}
