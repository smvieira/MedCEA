---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-explorer
  namespace: ${NAMESPACE}
  labels:
    app: mqtt-explorer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mqtt-explorer
  template:
    metadata:
      labels:
        app: mqtt-explorer
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "200m"
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
      volumes:
      - name: html
        configMap:
          name: mqtt-explorer-html
---
apiVersion: v1
kind: Service
metadata:
  name: mqtt-explorer
  namespace: ${NAMESPACE}
spec:
  selector:
    app: mqtt-explorer
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mqtt-explorer
  namespace: ${NAMESPACE}
spec:
  # TLS from the platform CA. Adding this also makes nginx-ingress redirect
  # plain HTTP here with a 308, which is why every registered redirect URI had
  # to move to https in the same change.
  tls:
  - hosts: [${MQTTX_DOMAIN}]
    secretName: cea-tls
  ingressClassName: nginx
  rules:
  - host: ${MQTTX_DOMAIN}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: mqtt-explorer
            port:
              number: 80
