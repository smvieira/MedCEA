# ConfigMap mosquitto-config while IAM_MQTT_PERSON=false: one password and ACL file for
# both listeners (services and boards; no Explorer account since 1 Nov 2026). Applied by
# deploy-infra.sh instead of mosquitto-conf-person.yaml; the conf of before IAM 3.5 plus
# the boards' TLS listener 8883 (5 Nov 2026; tests/golden/mosquitto-conf.yaml).
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mosquitto-config
  namespace: ${NAMESPACE}
data:
  # Every client authenticates: boards with the per-device credential minted at
  # onboarding (medcea.mqtt_credential), platform services with the accounts in
  # the Secret mosquitto-service-auth. Both files are assembled by the
  # mqtt-auth-sync sidecar below and re-read on SIGHUP.
  # websockets_headers_size: the explorer's socket arrives through its
  # oauth2-proxy with the browser's session cookie (several KB of tokens);
  # libwebsockets' default (~1 KB) silently drops that upgrade, which the
  # proxy reports as a 502 "proxy error: EOF".
  mosquitto.conf: |
    per_listener_settings false
    websockets_headers_size 16384
    allow_anonymous false
    password_file /mosquitto/auth/passwd
    acl_file /mosquitto/auth/acl
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout
    listener 1883
    listener 9001
    protocol websockets
    # The boards' only way in from the LAN (NodePort 31884): TLS, the broker's own
    # certificate (Secret mosquitto-tls, by deploy-infra.sh from the platform CA).
    listener 8883
    certfile /mosquitto/certs/tls.crt
    keyfile /mosquitto/certs/tls.key
