# MedCEA login theme — the platform's own sign-in / request-access page.
# parent=base: Keycloak's page logic and every secondary page (forgot password,
# update password, errors, logout) without any of its PatternFly styling; the
# look comes from template.ftl and css/medcea.css only.
parent=base
styles=css/medcea.css
# Filled in by deploy-infra.sh (render): where the Request access tab posts.
accessUrl=https://${ACCESS_DOMAIN}
portalUrl=https://${PORTAL_DOMAIN}

kcHtmlClass=
kcBodyClass=
kcLoginClass=
kcFormCardClass=card
kcFormHeaderClass=card-head
kcFormClass=form
kcFormGroupClass=field
kcLabelWrapperClass=
kcLabelClass=label
kcInputWrapperClass=
kcInputClass=input
kcInputGroup=input-group
kcInputErrorMessageClass=field-error
kcFormSettingClass=options
kcFormOptionsClass=options
kcFormOptionsWrapperClass=options-right
kcFormButtonsClass=buttons
kcFormButtonsWrapperClass=buttons
kcButtonClass=btn
kcButtonPrimaryClass=btn-primary
kcButtonDefaultClass=btn-secondary
kcButtonBlockClass=btn-block
kcButtonLargeClass=
kcFormPasswordVisibilityButtonClass=pw-toggle
kcFormPasswordVisibilityIconShow=pw-show
kcFormPasswordVisibilityIconHide=pw-hide
kcAlertClass=alert
kcAlertTitleClass=alert-text
kcContentWrapperClass=
kcSignUpClass=info
kcInfoAreaWrapperClass=
kcFormSocialAccountSectionClass=social
kcFormSocialAccountListClass=social-list
kcFormSocialAccountListButtonClass=btn btn-secondary btn-block
kcCheckboxInputClass=checkbox
kcSelectAuthListClass=auth-list
kcSelectAuthListItemClass=auth-item
