apiVersion: v1
kind: Secret
metadata:
  name: grafana-datasource
  namespace: ${NAMESPACE}
stringData:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: IoT Postgres
      # Pinned: apps/report/dashboards/*.json reference the datasource by this
      # uid. Without it Grafana generates a random one and the panels bind only
      # by luck.
      uid: PA68174188487FD5C
      type: postgres
      url: rdbms-postgresql.${NAMESPACE}.svc.cluster.local:5432
      database: ${POSTGRES_DB}
      # postgres, or svc_grafana (IAM 2.5, infra/lib-db-roles.sh db_client)
      user: ${DS_USER}
      secureJsonData:
        password: "${DS_PASS}"
      jsonData:
        sslmode: disable
        postgresVersion: 1500
