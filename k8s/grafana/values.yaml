# Grafana Admin is the local break-glass account only (Secret grafana-admin, user
# ADMIN_USER, password GRAFANA_BREAKGLASS_PASS), reached at /login?disableAutoLogin.
# No persistence: every pod starts with an empty database, so a role change takes
# effect at each person's next sign-in and the admin password from the Secret.
admin:
  existingSecret: grafana-admin
  userKey: admin-user
  passwordKey: admin-password
env:
  GF_SERVER_ROOT_URL: "https://${GRAFANA_DOMAIN}"
  GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
  # Skip Grafana's own login page; the platform login (Keycloak theme medcea) is
  # the only one. The local admin is still reachable at /login?disableAutoLogin.
  GF_AUTH_OAUTH_AUTO_LOGIN: "true"
  GF_AUTH_GENERIC_OAUTH_NAME: "Keycloak"
  GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "grafana"
  GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "${GRAFANA_OAUTH_SECRET}"
  # `groups`: the realm roles (composites expanded), the claim the role path reads.
  GF_AUTH_GENERIC_OAUTH_SCOPES: "openid profile email groups"
  GF_AUTH_GENERIC_OAUTH_AUTH_URL: "https://${KEYCLOAK_DOMAIN}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth"
  GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "http://keycloak.${NAMESPACE}.svc.cluster.local/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token"
  GF_AUTH_GENERIC_OAUTH_API_URL: "http://keycloak.${NAMESPACE}.svc.cluster.local/realms/${KEYCLOAK_REALM}/protocol/openid-connect/userinfo"
  GF_AUTH_GENERIC_OAUTH_TLS_SKIP_VERIFY_INSECURE: "false"
  GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC: "false"
  # Compiled from the access policy (policy_grafana, infra/lib-oauth2-proxy.sh):
  # dashboards U → Editor, R → Viewer, anything else '' → refused (strict).
  GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "${GRAFANA_ROLE_PATH}"
  GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "${GRAFANA_ROLE_STRICT}"
  GF_AUTH_GENERIC_OAUTH_ALLOW_ASSIGN_GRAFANA_ADMIN: "false"
  # Explore stays Editor-only; a Viewer never edits and an Editor never administers.
  GF_USERS_VIEWERS_CAN_EDIT: "false"
  GF_USERS_EDITORS_CAN_ADMIN: "false"
  # Short sessions (decision of 1 Nov 2026, "short sessions + one-hop sign-out"; it
  # narrows the earlier "bounded to 1 hour"): a Grafana session ends after 5 minutes
  # without use (inactivity counts from the last token rotation), and at the latest one
  # hour after its sign-in, used or not (the maximum lifetime counts from creation;
  # rotation does not extend it). Not 5 minutes outright: at the end the page's next API
  # call answers 401 and Grafana 10.4 reloads it, dropping unsaved dashboard and panel
  # edits without asking, so a hard 5-minute end would cost an Editor their work every
  # 5 minutes (the same "unless that drops work" exception as the Node-RED editor and
  # pgAdmin; review of 1 Nov 2026). The reload goes to /login and, with
  # GF_AUTH_OAUTH_AUTO_LOGIN, through Keycloak silently (while the Keycloak session lives)
  # as whoever is signed in to Keycloak in that browser now, back to the same page. So
  # after a Sign out, an account switch or an SSO expiry Grafana follows the Keycloak
  # person within 5 minutes once its tab is idle, and within the hour while the tab keeps
  # making requests (a dashboard with auto-refresh counts as use); a removed role or a
  # deactivation reaches it as fast (Grafana does not see Keycloak session ends by
  # itself).
  GF_AUTH_LOGIN_MAXIMUM_LIFETIME_DURATION: "1h"
  GF_AUTH_LOGIN_MAXIMUM_INACTIVE_LIFETIME_DURATION: "5m"
  # Rotate the session token every 2 minutes (Grafana's minimum; default 10), so the
  # inactivity limit above never ends a session that is in use.
  GF_AUTH_TOKEN_ROTATION_INTERVAL_MINUTES: "2"
extraSecretMounts:
- name: datasource-secret
  secretName: grafana-datasource
  defaultMode: 0440
  mountPath: /etc/grafana/provisioning/datasources
  readOnly: true
