---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgadmin-servers
  namespace: ${NAMESPACE}
data:
  servers.json: |
    {
      "Servers": {
        "1": {
          "Name": "IoT Postgres",
          "Group": "MedCEA",
          "Host": "rdbms-postgresql.${NAMESPACE}.svc.cluster.local",
          "Port": 5432,
          "MaintenanceDB": "${POSTGRES_DB}",
          "Username": "${PGA_DB_USER}",
          "PassFile": "/pgpassfile",
          "SSLMode": "disable",
          "Shared": true
        }
      }
    }
---
apiVersion: v1
kind: Secret
metadata:
  name: pgadmin-pgpassfile
  namespace: ${NAMESPACE}
stringData:
  pgpassfile: "rdbms-postgresql.${NAMESPACE}.svc.cluster.local:5432:*:${PGA_DB_USER}:${PGA_DB_PASS}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgadmin
  namespace: ${NAMESPACE}
  labels:
    app: pgadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgadmin
  template:
    metadata:
      labels:
        app: pgadmin
      annotations:
        # servers.json is imported at start only: a new login starts a new pod
        # (postgres, or rr_admin_login under IAM_DB_SERVICE_ROLES, IAM 2.5)
        medcea/db-user: "${PGA_DB_USER}"
    spec:
      # The pod resolves names through cluster DNS, which knows nothing of a
      # name-based domain like keycloak.medcea. pgAdmin talks to Keycloak by its
      # public URL (the issuer in the tokens must match), so point that one name
      # at the node, whose ingress serves it.
      hostAliases:
      - ip: "${PLATFORM_IP}"
        hostnames: ["${KEYCLOAK_DOMAIN}"]
      initContainers:
      - name: fix-pgpassfile-perms
        image: busybox:1.36
        command: ["sh", "-c", "cp /pgpassfile-src/pgpassfile /pgpassfile-rw/pgpassfile && chmod 0600 /pgpassfile-rw/pgpassfile"]
        volumeMounts:
        - name: pgpassfile-src
          mountPath: /pgpassfile-src
        - name: pgpassfile-rw
          mountPath: /pgpassfile-rw
      containers:
      - name: pgadmin
        image: dpage/pgadmin4:9
        env:
        - name: PGADMIN_DEFAULT_EMAIL
          value: "${ADMIN_EMAIL}"
        - name: PGADMIN_DEFAULT_PASSWORD
          value: "${ADMIN_PASS}"
        - name: PGADMIN_SERVER_JSON_FILE
          value: "/pgadmin4/servers.json"
        - name: PGPASSFILE
          value: "/pgpassfile"
        # Sign-in through Keycloak only. The roles it admits come from the
        # access policy (platform_admin's tool block: `cli.py compile pgadmin`,
        # policy_tool in infra/lib-policy-tools.sh, rendered as PGADMIN_OAUTH2_CLAIMS);
        # pgAdmin checks them only at sign-in. PGADMIN_CONFIG_* values
        # are written verbatim into config_distro.py, so they are Python
        # literals: strings quoted, True/False capitalised. The default e-mail
        # above is the admin's Keycloak e-mail too, so their SSO login lands on
        # the account that owns the preconfigured server; other admins are
        # created on first login and see it because it is "Shared".
        # Break-glass if Keycloak is down:
        #   kubectl set env deployment/pgadmin PGADMIN_CONFIG_AUTHENTICATION_SOURCES="['internal']"
        - name: PGADMIN_CONFIG_AUTHENTICATION_SOURCES
          value: "['oauth2']"
        - name: PGADMIN_CONFIG_OAUTH2_AUTO_CREATE_USER
          value: "True"
        - name: PGADMIN_CONFIG_OAUTH2_CONFIG
          value: >-
            [{'OAUTH2_NAME': 'keycloak', 'OAUTH2_DISPLAY_NAME': 'MedCEA sign-in',
            'OAUTH2_CLIENT_ID': 'pgadmin', 'OAUTH2_CLIENT_SECRET': '${PGADMIN_OAUTH_SECRET}',
            'OAUTH2_TOKEN_URL': 'https://${KEYCLOAK_DOMAIN}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token',
            'OAUTH2_AUTHORIZATION_URL': 'https://${KEYCLOAK_DOMAIN}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth',
            'OAUTH2_API_BASE_URL': 'https://${KEYCLOAK_DOMAIN}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/',
            'OAUTH2_USERINFO_ENDPOINT': 'userinfo',
            'OAUTH2_SERVER_METADATA_URL': 'https://${KEYCLOAK_DOMAIN}/realms/${KEYCLOAK_REALM}/.well-known/openid-configuration',
            'OAUTH2_SCOPE': 'openid email profile',
            'OAUTH2_ICON': 'fa-key', 'OAUTH2_BUTTON_COLOR': '#2563eb',
            'OAUTH2_SSL_CERT_VERIFICATION': False,
            'OAUTH2_ADDITIONAL_CLAIMS': ${PGADMIN_OAUTH2_CLAIMS}}]
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /misc/ping
            port: 80
          initialDelaySeconds: 20
          periodSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        volumeMounts:
        - name: servers-config
          mountPath: /pgadmin4/servers.json
          subPath: servers.json
        - name: pgpassfile-rw
          mountPath: /pgpassfile
          subPath: pgpassfile
      volumes:
      - name: servers-config
        configMap:
          name: pgadmin-servers
      - name: pgpassfile-src
        secret:
          secretName: pgadmin-pgpassfile
      - name: pgpassfile-rw
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: pgadmin
  namespace: ${NAMESPACE}
spec:
  selector:
    app: pgadmin
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pgadmin
  namespace: ${NAMESPACE}
spec:
  # TLS from the platform CA. Adding this also makes nginx-ingress redirect
  # plain HTTP here with a 308, which is why every registered redirect URI had
  # to move to https in the same change.
  tls:
  - hosts: [${PGADMIN_DOMAIN}]
    secretName: cea-tls
  ingressClassName: nginx
  rules:
  - host: ${PGADMIN_DOMAIN}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: pgadmin
            port:
              number: 80
