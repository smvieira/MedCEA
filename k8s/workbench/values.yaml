hub:
  # Hub administration (IAM 3.2: K is administration, not content) is the custom role
  # workbench-admin, never JupyterHub's built-in `admin` role: that one carries tokens
  # (mint a token for any user, which opens their server), access:servers and shares,
  # and its scopes cannot be changed. hub.loadRoles, not hub.config.JupyterHub.load_roles:
  # the chart appends these to its own list, which holds the idle culler's role.
  loadRoles:
    workbench-admin:
      description: "Hub administration (IAM 3.2, K): admin page, list users, start and stop servers, remove hub users; never open a server"
      # Exactly these (health-check iamworkbench, tests/iam-hosts.sh and
      # tests/test_workbench_render.py compare them with WORKBENCH_ADMIN_ROLE_SCOPES in
      # infra/lib-oauth2-proxy.sh). Never tokens, access:servers, shares, admin:users
      # (it could PATCH itself admin), groups or admin:auth_state. `servers` starts and
      # stops; a start's user_options are ignored (KubeSpawner has no profile_list here).
      scopes: [admin-ui, list:users, read:users, servers, delete:users]
      # The policy's compiled admin groups (IAM_GATES=true; hub groups follow the
      # Keycloak groups claim at every sign-in, manage_groups) or, IAM_GATES=false,
      # [ADMIN_USER] (policy_workbench in infra/lib-oauth2-proxy.sh).
      groups: ${WORKBENCH_ADMIN_GROUPS}
      users: ${WORKBENCH_HUBADMIN_USERS}
    admin:
      # The built-in role, its scopes unchanged: nobody holds it. An exact (empty) member
      # list makes the hub strip a stored admin=True from every user at start.
      users: []
  config:
    JupyterHub:
      authenticator_class: generic-oauth
      # DEPRECATED since JupyterHub 2.0 and without effect: the scopes of a user's roles
      # decide (workbench-admin above). Kept false only so no reader takes it for on.
      admin_access: false
      # A session lasts an hour, then the sign-in runs again through Keycloak (silent while
      # the Keycloak session lives) and the groups are checked again: a role removal or a
      # deactivation reaches the hub within the hour. An open notebook's own token
      # (oauth_token_expires_in) lasts as long; a tab open longer reloads through sign-in.
      cookie_max_age_days: 0.0417
      oauth_token_expires_in: 3600
    Authenticator:
      # The gate (infra/lib-oauth2-proxy.sh policy_workbench): IAM_GATES=true renders
      # allow_all false and the groups compiled from the access policy; IAM_GATES=false
      # the pre-policy sign-in (any realm account, ADMIN_USER holds workbench-admin).
      allow_all: ${WORKBENCH_ALLOW_ALL}
      # Always empty in both modes: admin_users would be admitted whatever the groups say
      # and would get the built-in admin role.
      admin_users: []
      # Never true: it would admit every user already in the hub's database.
      allow_existing_users: false
      # No auth_state is stored: with it, anyone holding admin:auth_state could read every
      # person's Keycloak tokens (workbench-admin does not). The groups are checked at
      # each sign-in instead.
      enable_auth_state: false
      # No "Sign in with Keycloak" page: straight to the platform login.
      auto_login: true
    GenericOAuthenticator:
      client_id: workbench
      client_secret: "${WORKBENCH_SECRET}"
      oauth_callback_url: https://${WORKBENCH_DOMAIN}/hub/oauth_callback
      authorize_url: https://${KEYCLOAK_DOMAIN}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth
      token_url: http://keycloak.${NAMESPACE}.svc.cluster.local/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token
      userdata_url: http://keycloak.${NAMESPACE}.svc.cluster.local/realms/${KEYCLOAK_REALM}/protocol/openid-connect/userinfo
      login_service: "Keycloak"
      username_claim: preferred_username
      # `groups` is a default client scope of client workbench, so the claim arrives
      # in the userinfo response without being requested.
      scope: ["openid", "profile", "email"]
      # OAuthenticator 17 (hub image k8s-hub 4.4.1): allowed_groups and
      # auth_state_groups_key need manage_groups. The groups come from this sign-in's
      # auth_model (in memory), so enable_auth_state stays false. No admin_groups: it
      # would give the built-in admin role (workbench-admin above is held by group).
      manage_groups: true
      auth_state_groups_key: "oauth_user.groups"
      allowed_groups: ${WORKBENCH_ALLOWED_GROUPS}
      custom_403_message: ${WORKBENCH_403_MESSAGE}
    KubeSpawner:
      # Removing a hub user (admin page) keeps the person's home volume claim-<name>
      # (KubeSpawner's default would delete it: K is not D).
      delete_pvc: false

proxy:
  service:
    type: ClusterIP          # the nginx ingress fronts this; no LoadBalancer, no MetalLB

singleuser:
  image:
    # Pinned (WORKBENCH_IMAGE): JupyterLab 4.6 with the git panel (@jupyterlab/git 0.55)
    # and nbdime come with the image; a moving tag would change them under people.
    name: ${WORKBENCH_IMAGE_NAME}
    tag: ${WORKBENCH_IMAGE_TAG}
  storage:
    # claim-<name> keeps the person's home across server restarts and hub-user removals
    # (delete_pvc false). Deleting the namespace deletes it: every uninstall path warns
    # first (infra/lib-workbench-homes.sh). Not backed up.
    capacity: ${WORKBENCH_STORAGE}
    # The example notebooks, read-only inside the home (ConfigMap workbench-examples,
    # from k8s/workbench/examples/): a person copies one to change it.
    extraVolumes:
      - name: medcea-examples
        configMap:
          name: workbench-examples
    extraVolumeMounts:
      - name: medcea-examples
        mountPath: /home/jovyan/medcea-examples
        readOnly: true
  # Where a notebook signs its person in and reads platform data (medcea_data.py, IAM
  # 3.2b). Endpoints only: no secret, no token, no database password in the pod.
  extraEnv:
    MEDCEA_KEYCLOAK: "http://keycloak.${NAMESPACE}.svc.cluster.local/realms/${KEYCLOAK_REALM}"
    MEDCEA_API: "http://config-api.${NAMESPACE}.svc.cluster.local:3000"
    MEDCEA_CLIENT_ID: "workbench-notebook"
    MEDCEA_NOTEBOOK_REPO: "${WORKBENCH_NOTEBOOK_REPO}"
    PYTHONPATH: "/home/jovyan/medcea-examples"
  networkPolicy:
    enabled: true
    # No private address (no platform service, no database) and no cloud metadata, as
    # the chart's defaults, stated so health-check iamworkbench can compare them; the
    # internet stays reachable (pip, GitHub).
    egressAllowRules:
      privateIPs: false
      cloudMetadataServer: false
      nonPrivateIPs: true
    # The only platform hops: Keycloak (device sign-in) and config-api (PostgREST with the
    # person's own token), compiled from the access policy's network.clients.notebooks by
    # policy_workbench_egress; [] unless IAM_POSTGREST_JWT and IAM_DB_ROLES are true.
    egress: ${WORKBENCH_EGRESS}
  memory: { guarantee: 512M, limit: 4G }
  cpu: { guarantee: 0.1, limit: 2 }
  defaultUrl: "/lab"
  # Installed into the user's persistent home, so only the first start pays for
  # it. Baking these into an image is the better answer at scale — see the
  # infra/workbench.Dockerfile — but this keeps the deployment to one Helm
  # release with no registry to run.
  # Every start (idempotent) also makes nbstripout the global git filter for *.ipynb,
  # so a commit never stores cell outputs (telemetry values), and sets git's credential
  # store (the person's GitHub token stays in their home) unless they chose another
  # helper. Fail closed (IAM 3.2b): the filter's attribute, its clean command and
  # `required` are written even when the pip install fails, so git then refuses to
  # stage a notebook rather than store it whole; and the global core.hooksPath (unless
  # the person set one) runs medcea-examples/nb_output_guard.py as pre-commit, which
  # refuses a staged notebook still holding outputs — a repository's own .gitattributes
  # can turn the filter off, not that hook. A failure never stops the server.
  lifecycleHooks:
    postStart:
      exec:
        command:
          - "sh"
          - "-c"
          - >
            (test -x "$HOME/.local/bin/code-server" ||
             (pip install --quiet --user jupyter-collaboration jupyter-vscode-proxy &&
              curl -fsSL https://code-server.dev/install.sh |
                sh -s -- --method=standalone --prefix="$HOME/.local" )) ;
            (python3 -c "import nbstripout" 2>/dev/null || pip install --quiet --user nbstripout) ;
            (python3 -m nbstripout --is-installed --global ||
             python3 -m nbstripout --install --global) ;
            (git config --global --get filter.nbstripout.clean >/dev/null ||
             git config --global filter.nbstripout.clean "python3 -m nbstripout") ;
            git config --global filter.nbstripout.required true ;
            ATTRS="$(git config --global --path --get core.attributesFile)" ;
            [ -n "$ATTRS" ] || { ATTRS="$HOME/.config/git/attributes" ;
              git config --global core.attributesFile "$ATTRS" ; } ;
            mkdir -p "$(dirname "$ATTRS")" ;
            (grep -qx '*.ipynb filter=nbstripout' "$ATTRS" 2>/dev/null ||
             echo '*.ipynb filter=nbstripout' >> "$ATTRS") ;
            HOOKS="$HOME/.config/git/hooks" ;
            (git config --global --get core.hooksPath >/dev/null ||
             git config --global core.hooksPath "$HOOKS") ;
            if [ "$(git config --global --path --get core.hooksPath)" = "$HOOKS" ]; then
              mkdir -p "$HOOKS" &&
              printf '#!/bin/sh\nexec python3 /home/jovyan/medcea-examples/nb_output_guard.py\n' > "$HOOKS/pre-commit" &&
              chmod +x "$HOOKS/pre-commit" ; fi ;
            (git config --global --get credential.helper >/dev/null ||
             git config --global credential.helper store) ;
            true

cull:
  enabled: true
  timeout: 3600            # reclaim a user pod after an hour idle
  every: 300

ingress:
  enabled: true
  ingressClassName: nginx
  hosts: ["${WORKBENCH_DOMAIN}"]
  tls:
    - hosts: ["${WORKBENCH_DOMAIN}"]
      secretName: cea-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
