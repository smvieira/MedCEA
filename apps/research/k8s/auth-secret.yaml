# The superuser password of research-postgresql (auth.existingSecret of k8s/values.yaml).
# Render list: RESEARCH_DB_PASS
#   render apps/research/k8s/auth-secret.yaml RESEARCH_DB_PASS | kubectl apply -n $RESEARCH_NAMESPACE -f -
# The value reaches envsubst through its environment and kubectl on stdin, never argv.
# PostgreSQL takes it only when the volume is first initialised: a changed
# RESEARCH_DB_PASS on an existing volume is not applied to the server.
apiVersion: v1
kind: Secret
metadata:
  name: research-postgresql-auth
  labels:
    app.kubernetes.io/part-of: medcea-research
type: Opaque
stringData:
  postgres-password: "${RESEARCH_DB_PASS}"
