# One login of the research database, for a pod in the platform namespace
# (research-export-writer: the exporter; research-backup: the nightly backup).
# Render list: SECRET_NAME DB_ROLE DB_PASS
#   render apps/research/k8s/role-secret.yaml SECRET_NAME DB_ROLE DB_PASS | kubectl apply -n $NAMESPACE -f -
# Never labelled medcea/db-role: apps/database/uninstall.sh --purge-data deletes those,
# and these are not platform database roles.
apiVersion: v1
kind: Secret
metadata:
  name: ${SECRET_NAME}
  labels:
    app.kubernetes.io/part-of: medcea-research
type: Opaque
stringData:
  username: "${DB_ROLE}"
  password: "${DB_PASS}"
