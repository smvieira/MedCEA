apiVersion: v1
kind: ConfigMap
metadata:
  name: recipe-fileserver
  namespace: ${NAMESPACE}
data:
  server.py: |
    import os, sys, json, socket, time, importlib.util
    from http.server import HTTPServer, BaseHTTPRequestHandler
    from urllib.parse import unquote

    RECIPES_DIR    = '/recipes'
    DEVICES_DIR    = '/devices'
    UNITS_DIR      = '/units'
    LOCATIONS_DIR  = '/locations'

    def _resolve(path):
        """Returns (base_dir, fname_or_None, is_list). Dispatch on a whole first
        segment, as the route table does: /devicesX.json is a recipe file, not a
        device file (the access check and this function must agree)."""
        if path == '/devices' or path.startswith('/devices/'):
            rest = path[len('/devices'):]
            if rest in ('', '/'):
                return DEVICES_DIR, None, True
            fname = unquote(rest.lstrip('/'))
            if '/' in fname or not fname.endswith('.json'):
                return DEVICES_DIR, None, False  # invalid
            return DEVICES_DIR, fname, False
        elif path == '/locations' or path.startswith('/locations/'):
            rest = path[len('/locations'):]
            if rest in ('', '/'):
                return LOCATIONS_DIR, None, True
            fname = unquote(rest.lstrip('/'))
            if '/' in fname or not fname.endswith('.json'):
                return LOCATIONS_DIR, None, False  # invalid
            return LOCATIONS_DIR, fname, False
        elif path == '/units' or path.startswith('/units/'):
            rest = path[len('/units'):]
            if rest in ('', '/'):
                return UNITS_DIR, None, True
            fname = unquote(rest.lstrip('/'))
            if '/' in fname or not fname.endswith('.json'):
                return UNITS_DIR, None, False  # invalid
            return UNITS_DIR, fname, False
        else:
            if path.rstrip('/') == '' or path == '/':
                return RECIPES_DIR, None, True
            fname = unquote(path.lstrip('/'))
            if '/' in fname or not fname.endswith('.json'):
                return RECIPES_DIR, None, False  # invalid
            return RECIPES_DIR, fname, False

    def check_host(host, port=None, timeout=3):
        """ICMP ping via subprocess. Returns (online, latency_ms, error)."""
        import subprocess
        t0 = time.monotonic()
        try:
            r = subprocess.run(
                ['ping', '-c', '1', '-W', str(timeout), host],
                capture_output=True, timeout=timeout + 1
            )
            ms = round((time.monotonic() - t0) * 1000)
            if r.returncode == 0:
                return True, ms, None
            else:
                return False, None, 'unreachable'
        except subprocess.TimeoutExpired:
            return False, None, 'timeout'
        except Exception as e:
            # Fallback: TCP connect to port 80
            try:
                sock = socket.create_connection((host, 80), timeout=timeout)
                sock.close()
                ms = round((time.monotonic() - t0) * 1000)
                return True, ms, None
            except socket.timeout:
                return False, None, 'timeout'
            except OSError as e2:
                return False, None, str(e2)

    # ── Access policy check (IAM plan 1.2) ──────────────────────────────────────
    # medcea_iam.py and the route table come from ConfigMap medcea-iam-lib at /iam/.
    # Loaded from the mount and reloaded when it changes, so a ConfigMap that appears
    # later heals and a new library needs no restart. While IAM_ENFORCE is false the
    # check only logs "would refuse ..." (stderr); nothing is refused.
    _IAM = {'mtime': None, 'mod': None, 'warned': False}


    def _medcea_iam():
        path = '/iam/medcea_iam.py'
        try:
            mtime = os.stat(path).st_mtime
            if mtime != _IAM['mtime']:
                spec = importlib.util.spec_from_file_location('medcea_iam', path)
                mod = importlib.util.module_from_spec(spec)
                spec.loader.exec_module(mod)
                _IAM.update(mtime=mtime, mod=mod)
        except Exception as e:  # noqa: BLE001 — a missing mount must not stop the service
            if not _IAM['warned']:
                print('medcea_iam: not loaded (%s); requests are not checked' % e, file=sys.stderr, flush=True)
                _IAM['warned'] = True
        return _IAM['mod']


    class H(BaseHTTPRequestHandler):
        def log_message(self, *a): pass
        def parse_request(self):
            if not super().parse_request():
                return False
            iam = _medcea_iam()
            if iam:
                return iam.http_check(self, 'platform-api')
            # No library: fail closed under enforcement (IAM_ENFORCE is also in the
            # pod's environment for this case), report-only otherwise.
            if os.environ.get('IAM_ENFORCE') == 'true' and self.path.split('?')[0] != '/healthz':
                self.send_error(503, 'access policy not loaded')
                return False
            return True
        def _send(self, code, body=b'', ct='application/json'):
            self.send_response(code)
            self.send_header('Content-Type', ct)
            self.send_header('Access-Control-Allow-Origin', '*')
            self.send_header('Content-Length', len(body))
            self.end_headers()
            self.wfile.write(body)
        def do_OPTIONS(self):
            self._send(204)
        def do_GET(self):
            # Device online check: GET /check/<hostname>[/<port>]
            if self.path.startswith('/check/'):
                parts = unquote(self.path[len('/check/'):]).split('/')
                host = parts[0]
                port = int(parts[1]) if len(parts) > 1 and parts[1].isdigit() else 80
                if not host:
                    self._send(400, b'{"error":"missing host"}'); return
                online, ms, err = check_host(host, port)
                result = {'online': online}
                if ms is not None: result['ms'] = ms
                if err: result['error'] = err
                self._send(200, json.dumps(result).encode())
                return
            base, fname, is_list = _resolve(self.path)
            if is_list:
                os.makedirs(base, exist_ok=True)
                files = sorted(f for f in os.listdir(base) if f.endswith('.json'))
                self._send(200, json.dumps(files).encode())
            elif not fname:
                self._send(400, b'{"error":"invalid filename"}')
            else:
                p = os.path.join(base, fname)
                if not os.path.exists(p):
                    self._send(404, b'{"error":"not found"}'); return
                with open(p, 'rb') as f:
                    self._send(200, f.read())
        def do_PUT(self):
            base, fname, _ = _resolve(self.path)
            if not fname:
                self._send(400, b'{"error":"invalid filename"}'); return
            n = int(self.headers.get('Content-Length', 0))
            body = self.rfile.read(n)
            try: json.loads(body)
            except: self._send(400, b'{"error":"invalid json"}'); return
            os.makedirs(base, exist_ok=True)
            with open(os.path.join(base, fname), 'wb') as f:
                f.write(body)
            self._send(200, b'{"ok":true}')

    HTTPServer(('', 8081), H).serve_forever()
