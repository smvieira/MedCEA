---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-ui
  namespace: ${NAMESPACE}
  labels:
    app: config-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-ui
  template:
    metadata:
      labels:
        app: config-ui
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
          name: http
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "200m"
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        - name: recipes
          mountPath: /usr/share/nginx/html/recipes
        - name: images
          mountPath: /usr/share/nginx/html/images
      - name: recipe-fileserver
        image: python:3.12-alpine
        command: ["python3", "/scripts/server.py"]
        ports:
        - containerPort: 8081
          name: fileserver
        resources:
          requests:
            memory: "32Mi"
            cpu: "20m"
          limits:
            memory: "64Mi"
            cpu: "100m"
        volumeMounts:
        - name: recipe-script
          mountPath: /scripts
        - name: recipes
          mountPath: /recipes
        - name: devices
          mountPath: /devices
        - name: units
          mountPath: /units
        - name: locations
          mountPath: /locations
        - name: iam-lib          # access policy route table (IAM plan 1.1); optional
          mountPath: /iam
          readOnly: true
      volumes:
      - name: html
        configMap:
          name: config-ui-html
      - name: nginx-conf
        configMap:
          name: config-ui-nginx
      - name: recipe-script
        configMap:
          name: recipe-fileserver
      - name: recipes
        hostPath:
          path: ${RECIPES_HOST_PATH}
          type: DirectoryOrCreate
      - name: devices
        hostPath:
          path: ${APP_DIR}/devices
          type: DirectoryOrCreate
      - name: units
        hostPath:
          path: ${APP_DIR}/units
          type: DirectoryOrCreate
      - name: locations
        hostPath:
          path: ${APP_DIR}/locations
          type: DirectoryOrCreate
      - name: images
        hostPath:
          path: ${APP_DIR}/images
          type: Directory
      - name: iam-lib
        configMap:
          name: medcea-iam-lib
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: config-ui
  namespace: ${NAMESPACE}
spec:
  selector:
    app: config-ui
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
---
