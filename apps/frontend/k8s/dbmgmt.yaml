apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbmgmt
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels: {app: dbmgmt}
  template:
    metadata:
      labels: {app: dbmgmt}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d
        - name: images
          mountPath: /usr/share/nginx/html/images
      - name: api
        image: python:3.12-alpine
        command: ["python", "/scripts/server.py"]
        ports:
        - containerPort: 8081
        env:
        - name: PG_HOST
          value: rdbms-postgresql.${NAMESPACE}.svc.cluster.local
        - name: PG_DATABASE
          value: medcea_db
        - name: PG_USER
          value: postgres
        - name: PG_PASSWORD
          value: "${POSTGRES_PASS}"
        - name: IAM_ENFORCE        # also in /iam/settings.json; this copy covers a missing mount
          value: "${IAM_ENFORCE}"
        volumeMounts:
        - name: api-script
          mountPath: /scripts
        - name: db-exports
          mountPath: /exports
        - name: iam-lib          # access check, route table, settings (IAM plan 1.1/1.2); optional
          mountPath: /iam
          readOnly: true
        - name: jwks             # the realm's signing keys (Secret medcea-jwks); optional
          mountPath: /jwks
          readOnly: true
      volumes:
      - name: html
        configMap:
          name: dbmgmt-html
      - name: nginx-conf
        configMap:
          name: dbmgmt-nginx
      - name: api-script
        configMap:
          name: dbmgmt-api
      - name: images
        hostPath:
          path: ${APP_DIR}/images
          type: Directory
      - name: db-exports
        hostPath:
          path: ${REPO_ROOT}/apps/database
          type: Directory
      - name: iam-lib
        configMap:
          name: medcea-iam-lib
          optional: true
      - name: jwks
        secret:
          secretName: medcea-jwks
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: dbmgmt
  namespace: ${NAMESPACE}
spec:
  selector: {app: dbmgmt}
  ports:
  - port: 80
    targetPort: 80
# No Ingress here: the host ${DBMGMT_DOMAIN} belongs to dbmgmt-oauth2-proxy
# (apps/frontend/deploy.sh), which upstreams to the Service above.
