apiVersion: apps/v1
kind: Deployment
metadata:
  name: dbmgmt
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels: {app: dbmgmt}
  template:
    metadata:
      labels: {app: dbmgmt}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d
        - name: images
          mountPath: /usr/share/nginx/html/images
      - name: api
        image: python:3.12-alpine
        command: ["python", "/scripts/server.py"]
        ports:
        - containerPort: 8081
        env:
        - name: PG_HOST
          value: rdbms-postgresql.${NAMESPACE}.svc.cluster.local
        - name: PG_DATABASE
          value: medcea_db
        - name: PG_USER
          value: postgres
        - name: PG_PASSWORD
          value: "${POSTGRES_PASS}"
        volumeMounts:
        - name: api-script
          mountPath: /scripts
        - name: db-exports
          mountPath: /exports
      volumes:
      - name: html
        configMap:
          name: dbmgmt-html
      - name: nginx-conf
        configMap:
          name: dbmgmt-nginx
      - name: api-script
        configMap:
          name: dbmgmt-api
      - name: images
        hostPath:
          path: ${APP_DIR}/images
          type: Directory
      - name: db-exports
        hostPath:
          path: ${REPO_ROOT}/apps/database
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: dbmgmt
  namespace: ${NAMESPACE}
spec:
  selector: {app: dbmgmt}
  ports:
  - port: 80
    targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: dbmgmt
  namespace: ${NAMESPACE}
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
spec:
  tls:
  - hosts: [${DBMGMT_DOMAIN}]
    secretName: cea-tls
  ingressClassName: nginx
  rules:
  - host: ${DBMGMT_DOMAIN}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: dbmgmt
            port: {number: 80}
