# config-ui nginx for IAM_POSTGREST_JWT=true (Phase 2b): config-ui-nginx.yaml plus
# the Bearer token on /api/ and the identity headers removed there. /scheduler-api/
# and /platform-api/ are unchanged. render FILE NAMESPACE.
apiVersion: v1
kind: ConfigMap
metadata:
  name: config-ui-nginx
  namespace: ${NAMESPACE}
data:
  default.conf: |
    # IAM Phase 2b: the person's access token, which the config proxy passes as
    # X-Forwarded-Access-Token (pass_access_token), goes to PostgREST as
    # Authorization: Bearer. This relies on oauth2-proxy stripping injected headers
    # (pass_access_token); never set preserveRequestValue. No token, no header.
    map $http_x_forwarded_access_token $medcea_pgrst_auth {
      ""      "";
      default "Bearer $http_x_forwarded_access_token";
    }
    server {
      listen 80;
      location /api/ {
        proxy_pass http://config-api.${NAMESPACE}.svc.cluster.local:3000/;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Only the Bearer token speaks for the caller: a client-sent Authorization
        # is replaced, and the cookie and identity headers never reach PostgREST
        # (request.headers/request.cookies would carry them into SQL).
        proxy_set_header Authorization $medcea_pgrst_auth;
        proxy_set_header X-Forwarded-Access-Token "";
        proxy_set_header Cookie "";
        proxy_set_header X-Forwarded-User "";
        proxy_set_header X-Forwarded-Email "";
        proxy_set_header X-Forwarded-Preferred-Username "";
        proxy_set_header X-Forwarded-Groups "";
        proxy_pass_header Content-Range;
        proxy_pass_header Range;
        add_header Access-Control-Expose-Headers Content-Range;
      }
      # The scheduler is a separate app, installed after frontend (alphabetical)
      # and removable on its own. A literal proxy_pass host is resolved once at
      # startup, so nginx crash-looped with "host not found in upstream" until
      # it existed. A variable defers the lookup to each request: a missing
      # scheduler is a 502 on /scheduler-api/, not a dead config UI.
      resolver kube-dns.kube-system.svc.cluster.local valid=30s;
      location /scheduler-api/ {
        set $scheduler_upstream scheduler.${NAMESPACE}.svc.cluster.local;
        rewrite ^/scheduler-api/(.*)$ /api/$1 break;
        proxy_pass http://$scheduler_upstream;
        proxy_read_timeout 120s;
      }
      location /platform-api/ {
        proxy_pass http://localhost:8081/;
        proxy_set_header Host $host;
      }
      location /recipes/ {
        alias /usr/share/nginx/html/recipes/;
        autoindex on;
        autoindex_format json;
        add_header Access-Control-Allow-Origin *;
      }
      location / {
        root /usr/share/nginx/html;
        index index.html;
        # The page is the app: without this, browsers cache it by heuristic
        # and keep running old JavaScript after a redeploy. no-cache still
        # caches, but revalidates — an unchanged page costs a 304 (ETag).
        add_header Cache-Control "no-cache" always;
      }
    }
