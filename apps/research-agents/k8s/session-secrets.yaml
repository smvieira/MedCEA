# apps/research-agents/k8s/session-secrets.yaml — research-session's two Secrets, in research-gw only
# (research Phase 4a, design R2: no Secret is placed in research-agents). Applied by
# apps/research-agents/deploy.sh through render, so the values reach kubectl on stdin and never an argv.
# Render list: RESEARCH_GW_NAMESPACE RS_SESSION_HMAC_KEY RS_SESSION_DB_PASS RS_SESSION_KID
apiVersion: v1
kind: Secret
metadata:
  name: research-session-key
  namespace: ${RESEARCH_GW_NAMESPACE}
  annotations:
    medcea/session-key-kid: "${RS_SESSION_KID}"
  labels:
    app: research-session
type: Opaque
stringData:
  key: "${RS_SESSION_HMAC_KEY}"
---
apiVersion: v1
kind: Secret
metadata:
  name: research-session-db
  namespace: ${RESEARCH_GW_NAMESPACE}
  labels:
    app: research-session
type: Opaque
stringData:
  password: "${RS_SESSION_DB_PASS}"
