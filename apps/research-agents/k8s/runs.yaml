# apps/research-agents/k8s/runs.yaml — the campaigns' outputs (research Phase 4a, design 3.5/R4): sim Jobs
# write /runs/campaigns/<cid>/, the orchestrator reads them (and writes traces/), mcp-sim reads them. A
# dynamic claim on the node's hostpath storage; backed up by the nightly job once research-runs is in
# RESEARCH_VOLUMES (6b2). Applied by apps/research-agents/deploy.sh. Render list: RESEARCH_AGENTS_NAMESPACE
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: research-runs
  namespace: ${RESEARCH_AGENTS_NAMESPACE}
  labels:
    app.kubernetes.io/part-of: medcea-research
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: microk8s-hostpath
  resources:
    requests:
      storage: 10Gi
