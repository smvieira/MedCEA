apiVersion: 1
providers:
- name: default
  type: file
  disableDeletion: false
  updateIntervalSeconds: 30
  # Dashboards change only through git and ./apps/report/deploy.sh (IAM 3.1);
  # an edit in the browser is refused (and would be lost at the next restart).
  allowUiUpdates: false
  options:
    path: /var/lib/grafana/dashboards