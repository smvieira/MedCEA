apiVersion: 1
providers:
- name: default
  type: file
  disableDeletion: false
  updateIntervalSeconds: 30
  # Dashboards change only through git and ./apps/report/deploy.sh (IAM 3.1);
  # an edit in the browser is refused. Editors' own dashboards (new ones, "Save as"
  # copies) are kept in Grafana's volume (decision of 1 Nov 2026).
  allowUiUpdates: false
  options:
    path: /var/lib/grafana/dashboards