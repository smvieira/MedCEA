server {
    listen 80;
    # no-cache: revalidate the page (ETag → 304) so a redeploy is seen at once.
    location / { root /usr/share/nginx/html; index index.html; try_files $uri /index.html; add_header Cache-Control "no-cache" always; }
    location /api/ { proxy_pass http://localhost:8082/api/; proxy_read_timeout 30s; }
}