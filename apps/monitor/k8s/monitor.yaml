apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitor
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels: {app: monitor}
  template:
    metadata:
      labels: {app: monitor}
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d
      - name: api
        image: python:3.11-slim
        command:
        - bash
        - -c
        - |
          pip install --quiet flask 'pyjwt[crypto]' psycopg2-binary &&           python /scripts/monitor-api.py
        ports:
        - containerPort: 8082
        env:
        - name: PG_HOST
          value: rdbms-postgresql.${NAMESPACE}.svc.cluster.local
        - name: PG_DATABASE
          value: medcea_db
        - name: PG_USER          # postgres, or the service's own role (IAM 2.5, infra/lib-db-roles.sh)
          value: "${PG_USER}"
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${PG_SECRET}
              key: ${PG_SECRET_KEY}
        - name: IAM_ENFORCE        # also in /iam/settings.json; this copy covers a missing mount
          value: "${IAM_ENFORCE}"
        volumeMounts:
        - name: api-script
          mountPath: /scripts
        - name: iam-lib          # access check, route table, settings (IAM plan 1.1/1.2); optional
          mountPath: /iam
          readOnly: true
        - name: jwks             # the realm's signing keys (Secret medcea-jwks); optional
          mountPath: /jwks
          readOnly: true
      volumes:
      - name: html
        configMap:
          name: monitor-html
      - name: nginx-conf
        configMap:
          name: monitor-nginx
      - name: api-script
        configMap:
          name: monitor-api
      - name: iam-lib
        configMap:
          name: medcea-iam-lib
          optional: true
      - name: jwks
        secret:
          secretName: medcea-jwks
          optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: monitor
  namespace: ${NAMESPACE}
spec:
  selector: {app: monitor}
  ports:
  - port: 80
    targetPort: 80
# No Ingress here: the host ${MONITOR_DOMAIN} belongs to monitor-oauth2-proxy
# (deploy.sh), which upstreams to the Service above.
