# iam-api (apps/iam/iam-api.py): the access policy's own service. IAM 3.5 serves
#   iam-mqttx  :8085  POST /_mqtt-credential — only the MQTT Explorer's oauth2-proxy
#                     upstream (NetworkPolicy iam-iam, compiled from network: by
#                     deploy-infra.sh, admits that proxy and the node)
#   iam        :8083  the Policy UI and its API (policy_api.py, IAM 4.3) — only the
#                     upstream of iam-oauth2-proxy (POLICY_DOMAIN) and the node; Service
#                     iam-admin :80 → 8083 (values-app.yaml sends to <service>:80)
# The compiler and the factory policy (ConfigMap iam-compiler, server-side applied: about
# 340 KiB) are mounted at /opt/iam, so the Policy UI shows a version with the skeleton this
# platform accepted; medcea/compiler-sha256 restarts the pod when they change.
# It logs in as iam_svc only (apps/iam/deploy.sh refuses a postgres fallback), and
# reads IAM_MQTT_PERSON live from /iam/settings.json, so no switch needs a redeploy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iam-api
  namespace: ${NAMESPACE}
  labels: {app: iam-api}
spec:
  replicas: 1
  selector:
    matchLabels: {app: iam-api}
  template:
    metadata:
      labels: {app: iam-api}
      annotations:
        medcea/compiler-sha256: "${IAM_COMPILER_SHA256}"
    spec:
      containers:
      - name: iam-api
        image: python:3.12-alpine
        command: ["sh", "-c", "pip install --quiet --no-cache-dir pg8000 'pyjwt[crypto]' pyyaml && exec python -u /app/iam-api.py"]
        ports:
        - {name: mqttx, containerPort: 8085}
        - {name: iam, containerPort: 8083}
        env:
        - {name: PG_HOST, value: "rdbms-postgresql.${NAMESPACE}.svc.cluster.local"}
        - {name: PG_DATABASE, value: "${POSTGRES_DB}"}
        - name: PG_USER            # iam_svc (IAM 2.5, infra/lib-db-roles.sh)
          value: "${PG_USER}"
        - name: PG_PASSWORD
          valueFrom:
            secretKeyRef:
              name: ${PG_SECRET}
              key: ${PG_SECRET_KEY}
        - {name: PROJECT_NAME, value: "${PROJECT_NAME}"}   # the MQTT topic root
        - {name: MQTTX_DOMAIN, value: "${MQTTX_DOMAIN}"}   # the only Origin a POST may come from
        - {name: IAM_ENFORCE, value: "${IAM_ENFORCE}"}     # informational: both ports always enforce
        - {name: POLICY_DOMAIN, value: "${POLICY_DOMAIN}"} # the only Origin a Policy UI POST may come from
        - {name: ACCESS_DOMAIN, value: "${ACCESS_DOMAIN}"} # the User Manager, linked from the Policy UI
        - {name: CONFIG_API_URL, value: "http://config-api.${NAMESPACE}.svc.cluster.local:3000"}   # confirm/dispute
        - {name: MEDCEA_COMPILER_DIR, value: /opt/iam}
        readinessProbe:             # Ready only once the Policy UI's port answers too
          httpGet: {path: /healthz, port: 8083}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /healthz, port: 8085}
          initialDelaySeconds: 60
          periodSeconds: 30
        resources:
          requests: {cpu: 10m, memory: 48Mi}
          limits: {memory: 160Mi}
        volumeMounts:
        - {name: code, mountPath: /app/iam-api.py, subPath: iam-api.py}
        - {name: code, mountPath: /app/mqtt_passwd.py, subPath: mqtt_passwd.py}   # infra/mqtt-passwd.py
        - {name: code, mountPath: /app/policy_api.py, subPath: policy_api.py}
        - {name: code, mountPath: /app/policy.html, subPath: policy.html}
        - {name: compiler, mountPath: /opt/iam, readOnly: true}
        - {name: iam-lib, mountPath: /iam, readOnly: true}   # access check, route table, mqtt.json, settings
        - {name: jwks, mountPath: /jwks, readOnly: true}     # the realm's signing keys (Secret medcea-jwks)
      volumes:
      - name: code
        configMap: {name: iam-api-code}
      - name: iam-lib
        configMap: {name: medcea-iam-lib, optional: true}
      - name: compiler             # keys compiler__<f>.py and policy__defaults.yaml, laid out as files
        configMap:
          name: iam-compiler
          items: ${IAM_COMPILER_ITEMS}
      - name: jwks
        secret: {secretName: medcea-jwks, optional: true}
---
# The MQTT Explorer's credential endpoint, reached only as an upstream of
# mqttx-oauth2-proxy (apps/mqtt-explorer/k8s/oauth2-proxy-values.yaml) — never
# from an Ingress.
apiVersion: v1
kind: Service
metadata:
  name: iam-mqttx
  namespace: ${NAMESPACE}
spec:
  selector: {app: iam-api}
  ports:
  - {name: mqttx, port: 8085, targetPort: mqttx}
---
# The Policy UI (IAM 4.3), reached only as the upstream of iam-oauth2-proxy
# (k8s/oauth2-proxy/values-app.yaml with APP_SERVICE=iam-admin) — never from an Ingress.
apiVersion: v1
kind: Service
metadata:
  name: iam-admin
  namespace: ${NAMESPACE}
spec:
  selector: {app: iam-api}
  ports:
  - {name: iam, port: 80, targetPort: iam}
