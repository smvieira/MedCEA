# ── Constraints ──────────────────────────────────────────────────────────────────────
# Named attribute rules that narrow the levels a cell lists in applies_to (or, in the
# per-level form, the levels its constraint map names). Evaluated per
# cell: a person passes if ANY of their effective roles holds the level without a
# constraint, or with a constraint that holds.
constraints:
  own_unit:
    summary: Only the units assigned to the person.
    effect: >
      Telemetry, runs and run logs are limited to the units in iam_policy.user_unit — every
      zone of an assigned unit, zones added later included. A measurement row carries the
      zone of the board that sent it, stamped at insert, and is filtered by that zone's
      current unit, so moving a zone to another unit moves its history with it. Such a move
      (an UPDATE of medcea.cea_zone.unit_id, which engineers hold) widens the new unit's
      operators without an account decision; it is recorded only in medcea.row_change — a
      qa_dual_control gap still open after IAM 2.7 (plan risk R9).
    enforced_by: ["RLS policies TO rr_operator on medcea.measurement (zone_id ∈ my_zones()), medcea.recipe_run (unit_id ∈ my_units()), medcea.recipe_line_cycle_run and medcea.run_release (through their run); other roles have explicit permissive policies", "monitor and scheduler routes filter by unit (2.6)"]
    rls:
      objects: [medcea.measurement, medcea.recipe_run, medcea.recipe_line_cycle_run, medcea.run_release]
      using:
        medcea.measurement: "zone_id = ANY ((SELECT medcea_auth.my_zones())::integer[])"
        medcea.recipe_run: "unit_id = ANY ((SELECT medcea_auth.my_units())::integer[])"
        medcea.recipe_line_cycle_run: "recipe_run_id IN (SELECT r.recipe_run_id FROM medcea.recipe_run r WHERE r.unit_id = ANY ((SELECT medcea_auth.my_units())::integer[]))"
        medcea.run_release: "recipe_run_id IN (SELECT r.recipe_run_id FROM medcea.recipe_run r WHERE r.unit_id = ANY ((SELECT medcea_auth.my_units())::integer[]))"
    help: Units are assigned with apps/iam/units.sh --by <username> (IAM 2.8; recorded pending_qa for the User Manager's Decisions tab) and, from IAM 4.3, in the User Manager. An operator with no unit sees no telemetry and no runs, and can start none. Moving a zone to another unit moves its telemetry to that unit's operators.
  assigned_run:
    summary: Execute only a run someone else prepared for one of your units.
    effect: An operator may execute or stop a run only when another person created it while holding production_manager (or a schedule such a person created triggered it), and its unit is one of the operator's units (iam_policy.user_unit).
    enforced_by: ["medcea.start_run() and set_run_status() check the unit first (a run of another unit and a missing run get the same refusal, before any status check, since both functions read past the RLS), then compare created_by_person and created_by_role", "scheduler route check"]
    help: Separates preparing a run from starting it.
  assign_only:
    summary: Assign approved recipes and parameter sets to units; never edit them.
    effect: INSERT/UPDATE on recipe_unit_permission only, pointing at approved recipes and approved parameter sets; nothing on recipe, recipe_line or unit_algorithm_params.
    enforced_by: ["table-level GRANT", "foreign key + trigger: the referenced recipe and parameter set must be approved"]
    limits_dml_to: [medcea.recipe_unit_permission]
    help: Lets the production manager plan with approved definitions without being able to change them.
  draft_only:
    summary: Edit drafts only.
    effect: UPDATE is refused by trigger on any recipe, recipe line, algorithm or parameter set whose status is not draft.
    enforced_by: ["trigger medcea.reject_non_draft_update() on recipe, recipe_line, control_algorithm, unit_algorithm_params"]
    limits_dml_to: [medcea.recipe, medcea.recipe_line, medcea.control_algorithm, medcea.unit_algorithm_params]
    help: Once qa approves it, a definition is frozen; a change starts a new draft.
  existing_slot:
    summary: Re-onboard into an existing slot only.
    effect: A board may be registered only into a slot that already has an inactive or replaced device; creating a new slot is refused.
    enforced_by: ["BEFORE INSERT/UPDATE trigger on medcea.device keyed on the caller's role", "the onboarding host admits only C and U holders"]
    help: Replacing a broken board is maintenance; adding a new slot is engineering.
  commissioning_unit:
    summary: Command only a unit flagged for commissioning.
    effect: The engineer's MQTT Explorer credential gets write rows only for units with commissioning = true and no active run. The sidecar re-derives the rows on every sync, and start_run() refuses a unit that is still flagged.
    enforced_by: ["iam-api credential issue", "mqtt-auth-sync re-derives ACL rows each sync", "medcea.start_run()"]
    help: Prevents commanding a chamber that is in production.
  not_own_author:
    summary: Approve only another person's work.
    effect: The approval function refuses when the approver's person_id equals the author's, the submitter's, the creator's, the executor's or (for account decisions) the subject's or the new person_id, or when the approver's own role is widened by the change. Account decisions also compare accounts (sub) with the maker and the subject, and a bootstrap unit decision without a subject person_id is compared by account only.
    enforced_by: ["approval functions compare person_id stored on the record with the person_id claim of the approver's verified token", "iam.confirm_decision, refuse_decision and review_decision (medcea_auth._account_actor) and access-api's live check of the subject's person_id in Keycloak"]
    help: Compares persons, not accounts. person_id is a token claim, set to the account's own id on first enable; a change is a qa-confirmed decision.
  qa_dual_control:
    summary: Account grants wait for qa.
    effect: >
      A grant, any role change that adds a (group, level) pair the old role did not hold,
      the activation of an account that holds a role (a widening from none), a new unit
      assignment, a mail settings change or a person_id change (always) stays pending_qa
      until a qa person who is neither the maker nor the subject confirms it.
      Deactivation, pure narrowing and unit removal act at once and are reviewed by qa
      afterwards; deactivation and pure narrowing revoke the person's MQTT credentials in
      the same transaction (medcea.revoke_person_mqtt). Bootstrap exceptions: the
      policy's --bootstrap, and apps/iam/units.sh assign --bootstrap (only while no other
      enabled qa account could confirm), whose assignments act at once and wait as
      pending_qa for confirmation or refusal (a refusal removes the unit).
    enforced_by: ["access-api and iam-api write iam.account_decision (iam.record_decision)", "the Keycloak change is made only on confirmation", "widening computed by the compiler from the effective matrix (medcea_auth.role_widening, routes.json widening)"]
    help: Two people for every grant; no delay for removing access.

# ── Waivers ──────────────────────────────────────────────────────────────────────────
# Accepted deviations, shown amber in the UI with their rationale and compensating
# controls. Only I10 and I11 can be waived (a CHECK on iam_policy.waiver.invariant and a
# compiler rule); a waiver names exactly one subject, group and set of levels, carries a
# review date, and is approved with the version like any change. `objects` names the
# members of the target group the waived levels compile to (grants.py); nothing else
# gets them.
waivers:
  - {id: W1, invariant: I11, subject: engineer, group: flows, target: measurements, levels: [C], objects: [medcea.measurement], review_by: "2027-10-27",
     rationale: "The Node-RED editor runs code with the ingest account, which must insert telemetry. Node-RED has no narrower mechanism.",
     controls: "Flows are deployed from git (apps/node-red/flows); health-check.sh diffs the editor's flows against git; measurement rows carry the ingest identity."}
  - {id: W2, invariant: I10, subject: svc_scheduler, group: controllers_state, target: controllers_state, levels: [U], objects: [medcea.algorithm_state], review_by: "2027-10-27",
     rationale: "A learning controller updates its Q-table during a run; that update is the record of what it learnt.",
     controls: "Every update appends a medcea.algorithm_state_event row with the run id; retirement is an approved event, never a delete."}

# ── Invariants ───────────────────────────────────────────────────────────────────────
# kind: matrix   — on every save of a draft, on the effective matrix (composites, implies and
#                  reaches expanded; a mirroring tool acts with the person's own cells, so it
#                  adds nothing); one Python checker, called by iam-api and by apply.sh
#       workflow — by the approval functions in the database and again by apply.sh
#       catalog  — inside apply.sh's database transaction, before anything else changes
waivable: [I10, I11]
invariants:
  - {code: I1, kind: matrix, rule: "No role holds U or D on a group of class regulated or history.", rationale: "Regulated records and audit trails are created once and never changed or deleted.", cites: "EU GMP Annex 11 §9; 21 CFR 11.10(e)"}
  - {code: I2, kind: matrix, rule: "admin holds nothing but K on groups of class regulated, history or personal, including what it reaches through tools.", rationale: "Administrators keep the system running and have no interest in the data.", cites: "MHRA GxP data integrity §6.16"}
  - {code: I3, kind: matrix, rule: "auditor holds only R or X.", rationale: "An inspector changes nothing.", cites: "Annex 11 §12"}
  - {code: I4, kind: matrix, rule: "On a group with an approval rule, no role holds both (C or U or O) and A.", rationale: "Whoever produces or executes cannot approve.", cites: "PIC/S PI 041-1 §9.3"}
  - {code: I5, kind: matrix, rule: "bio_scientist and control_scientist hold N on runs, schedules, measurements, mqtt_sense, mqtt_control and controllers_state, including through tools.", rationale: "Research stays outside the production record until the research sandbox exists.", cites: "MedCEA concept, research/production separation"}
  - {code: I6, kind: matrix, rule: "operator and production_manager hold N on research_workbench; engineer holds at most R there.", rationale: "Production roles do not run unvalidated code.", cites: "Annex 11 §4"}
  - {code: I7, kind: matrix, rule: "qp holds no C, U or O anywhere, and holds A on runs.", rationale: "The QP releases and does nothing else.", cites: "EU GMP Annex 16"}
  - {code: I11, kind: matrix, rule: "A tool cannot widen a role's access: for each group a tool reaches, the role must hold the reached levels on that group directly and without a constraint, unless waiver covers it. A mirroring tool acts with the person's own cells and cannot widen by construction.", rationale: "Access through Grafana, Node-RED or an export is still access to the data.", cites: "Annex 11 §12"}
  - {code: I12, kind: matrix, rule: "At least one role other than admin holds A on iam_policy and on iam_users; admin never holds A on either.", rationale: "The policy cannot be changed so that nobody independent can approve it.", cites: "Annex 11 §12"}
  - {code: I13, kind: matrix, rule: "Only admin holds K or D; D only on platform_admin.", rationale: "Administration and removal stay with one accountable role.", cites: "MHRA §6.16"}
  - {code: I14, kind: matrix, rule: "Every level in a cell applies to at least one member of its group; every A sits on a group with an approval rule; every constraint names levels the cell holds; every member and route belongs to one group only; waivers name only waivable invariants.", rationale: "A cell that compiles to nothing, or an escape hatch on a core rule, misleads the reader.", cites: "—"}
  - {code: I16, kind: matrix, rule: "Cells are closed under implies (U lists C and R).", rationale: "What the reader sees is what the compiler grants.", cites: "—"}
  - {code: I8, kind: workflow, rule: "A policy version is applied only after approval by a person holding A on iam_policy in the applied version who is not the submitter and whose own role the version does not widen.", rationale: "Every access change has two people behind it.", cites: "Annex 11 §12; PIC/S PI 041-1 §9.3"}
  - {code: I17, kind: workflow, rule: "No person holds an admin account and a qa account at the same time; checked by access-api against Keycloak on every role change and person_id change, at proposal and at confirmation.", rationale: "The administrator and the independent approver are different people.", cites: "PIC/S PI 041-1 §9.3"}
  - {code: I9, kind: catalog, rule: "anon and PUBLIC hold no privilege on any object in schemas medcea, iam and iam_policy, and anon holds only USAGE on schema medcea_auth and EXECUTE on medcea_auth.pre_request().", rationale: "Nothing is reachable without a verified identity.", cites: "21 CFR 11.10(d)"}
  - {code: I10, kind: catalog, rule: "Every service role's grants are within its ceiling; no service holds A except svc_access on iam_users and zones and svc_iam on iam_policy (whose approval functions refuse system actors); no service holds U or D on a regulated or history table unless a waiver covers it.", rationale: "A compromised service cannot rewrite the record or approve on its own.", cites: "21 CFR 11.10(e)"}
  - {code: I15, kind: catalog, rule: "The privileges in pg_catalog equal what the version compiles to (matrix, ceilings, infrastructure_functions), and every table in medcea, iam and iam_policy is a member of a group.", rationale: "Detects grants made outside the policy and tables nobody classified.", cites: "Annex 11 §12"}
