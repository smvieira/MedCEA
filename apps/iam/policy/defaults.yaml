# MedCEA IAM default policy — schema_version 2
#
# The one source of access rights on the platform. apps/iam/compiler/ turns it into
# PostgreSQL grants, oauth2-proxy allowed_groups, the Grafana / JupyterHub / Node-RED /
# edge-wizard / pgAdmin role settings, Mosquitto ACL rows and the route table every
# service enforces. The Policy UI shows every help text below and, under "See more", the
# concrete objects the compiler derives from a cell — so what is explained is what is
# enforced.
#
# Bootstrap (plan Section 3.4): on first install apps/iam/deploy.sh applies this file as
# version 1 under the deploy lock and records a 'bootstrap_applied' event; the first qa
# person then confirms version 1 like any later version. Afterwards the file is only the
# "Reset to defaults" template.
# Keys (roles, levels, groups, members, constraints, invariants) are stable identifiers;
# the UI edits cells, never keys. A key added here later reaches an existing install as a
# schema migration that adds N cells and a history event (plan Section 3.4, item 4).
#
# Cell syntax (matrix.<group>.<role>):
#   [R, X]                                    levels held, written closed under `implies`
#   {levels: [R, C, U], constraint: draft_only, applies_to: [U]}
#                                             a named constraint narrows the listed levels
#   {levels: [R, O], constraint: {R: own_unit, O: assigned_run}}
#                                             one constraint per level (no applies_to)
# A role not listed in a group's row holds N there.

schema_version: 2
policy_version: 1
title: MedCEA default access policy

about: >
  Who may do what on the MedCEA platform. Rows are resource groups (a set of tables,
  API routes, web pages and MQTT topics that belong together); columns are platform
  roles; a cell lists the access levels the role holds on the group. Every account has
  exactly one platform role. Changes are drafted by an administrator, approved by a
  different person holding qa, and applied on the platform host; every step is kept in
  an append-only, hash-chained history.

# ── Access levels ─────────────────────────────────────────────────────────────────────
# One scale, interpreted per resource type. `implies` is the only implication rule: every
# compiler (grants, proxies, routes, explain) expands a cell with it. `meaning` has a key
# for exactly the resource types that support the level (resource_types.*.levels).
levels:
  N:
    name: None
    implies: []
    summary: No access. The role does not see the resource at all.
    help: >
      The default for every cell. The role gets no database privilege, the API answers
      403, the web page is not offered and no MQTT topic is readable.
    meaning: {}
  R:
    name: Read
    implies: []
    summary: See the resource, change nothing.
    help: >
      Read rows, call GET routes and open the page. Reads of regulated data through the
      Monitor and the export are logged.
    meaning:
      data: SELECT
      api: GET routes of the group
      ui: admitted to the host (unless the host admits only higher levels)
      mqtt: topic read, through the person's own MQTT Explorer credential
      idp: list accounts and their roles (names, e-mail addresses)
      code: read the files in git
  X:
    name: Read and export
    implies: [R]
    summary: Read, and take a copy out of the platform.
    help: >
      Everything R gives, plus the Database Management export for this group. An export
      covers exactly the groups where the person holds X, and each export writes one row
      to iam_policy.export_log naming who exported which objects and when.
    meaning:
      data: SELECT (as R; the export service adds the group to the person's exportable set)
      api: export routes
      ui: admitted to the host
  C:
    name: Create
    implies: [R]
    summary: Add new records; never change existing ones.
    help: >
      Insert new rows and call create routes. Existing records stay untouched, which is
      why C is the level used for appending to regulated data and audit trails.
    meaning:
      data: INSERT (+ USAGE on the sequence)
      api: POST on create routes
      ui: admitted to the host
      mqtt: topic write (publish), through the person's own MQTT Explorer credential
      idp: create a disabled account (access request path)
  U:
    name: Update
    implies: [C, R]
    summary: Create and change records, within the group's constraint.
    help: >
      Insert and update. On configuration with an approval step (recipes, controllers)
      an update is possible only while the record is a draft. Removing a configuration
      record is an update to status 'retired', never a DELETE. Never granted to a person
      on regulated or history data (invariant I1).
    meaning:
      data: INSERT, UPDATE (rows the constraint allows)
      api: PUT / PATCH on edit routes, and retire routes
      ui: admitted to the host
      mqtt: as C
      idp: update account attributes and role mapping
      code: change the files (through a reviewed merge)
  A:
    name: Approve
    implies: [R]
    summary: Approve or release another person's work.
    help: >
      Record an approval through the group's approval function, called with the
      person's own verified token (never by a service on its own). The approver must be
      a different person from the author (constraint not_own_author). In this version an
      approval is an attributable, time-stamped record, NOT a 21 CFR Part 11 electronic
      signature: re-authentication and signature manifestation arrive with Section 7 of
      the plan.
    meaning:
      data: EXECUTE on the group's approval function, through PostgREST as the person's own role
      api: approve routes (policy and account decisions)
      ui: admitted to the host
      idp: confirm an account decision (qa_dual_control)
      code: approve a merge
  O:
    name: Operate
    implies: [R]
    summary: Start, stop or trigger a process; no change to its definition.
    help: >
      Run equipment and processes: execute a run, stop it, trigger a schedule. Kept apart
      from A so that stopping a run is never mistaken for releasing it, and apart from U
      so that operating never means editing a recipe.
    meaning:
      data: EXECUTE on medcea.start_run() and medcea.set_run_status()
      api: POST on operate routes (execute, stop, trigger)
      ui: admitted to the host
  K:
    name: Configure
    implies: []
    summary: Administer the tool; what that includes depends on the tool — see the meaning per type.
    help: >
      Administrative settings without the content the tool holds, with one exception
      that is stated rather than hidden: on accounts (idp) administering means reading and
      changing account records, which are personal data. On the AI workbench K is hub
      administration with admin_access disabled, so an administrator cannot enter other
      people's notebook servers. Held only by admin (invariant I13); on regulated or
      history data K never compiles to a privilege (invariant I2).
    meaning:
      api: admin routes of the group
      ui: admitted to the host; tool administration (JupyterHub admin without admin_access)
      idp: read, create, change and deactivate accounts and their roles (every grant confirmed by qa)
      infra: run the locked host scripts (break-glass, see break_glass)
  D:
    name: Delete
    implies: []
    summary: Remove platform components.
    help: >
      Remove components and releases on the platform host. Never data: no DELETE grant is
      compiled for any person (records are retired, not deleted). Held only by admin, on
      platform administration (invariant I13).
    meaning:
      api: DELETE routes of platform administration
      infra: remove releases and components (break-glass)

# Which levels can mean something for each member type. A level in a cell must apply to
# at least one member of its group (invariant I14); "See more" names the members it does
# not apply to.
resource_types:
  data:
    label: Database table, view or function
    enforced_by: PostgreSQL GRANT per role (rr_* for people through PostgREST, svc_* for services), row-level security for constraints, triggers for immutability
    levels: [N, R, X, C, U, A, O]
    help: The strongest gate, because it holds even when an application has a bug.
  api:
    label: Service route
    enforced_by: medcea_iam.check() in each service, against the compiled route table, on an identity taken from a verified access token
    levels: [N, R, X, C, U, A, O, K, D]
    help: Each route belongs to exactly one group and needs exactly one level; a route missing from the table is refused.
  ui:
    label: Web host behind Keycloak sign-in
    enforced_by: oauth2-proxy allowed_groups per host, or the tool's own OIDC role setting (Grafana, JupyterHub, pgAdmin, edge wizard)
    levels: [N, R, X, C, U, A, O, K]
    help: A coarse front gate; what a person may do on the page is decided by the API and the database.
  mqtt:
    label: Broker topic class
    enforced_by: Mosquitto ACL rows written by the auth sidecar from medcea.mqtt_credential and medcea.mqtt_service_acl
    levels: [N, R, C, U]
    help: People reach topics only through per-person, short-lived MQTT Explorer credentials that mirror their cells.
  idp:
    label: Keycloak account operation
    enforced_by: the access service's Keycloak service account, acting only after the route check and qa_dual_control
    levels: [N, R, C, U, A, K]
    help: Account changes are made by the User Manager, never directly in the Keycloak console (that is break-glass).
  infra:
    label: Host and cluster
    enforced_by: host accounts, sudo, kubeconfig and the deploy lock (documented control, not compiled)
    levels: [N, K, D]
    help: Shown for completeness; host access is break-glass and is not compiled.
  code:
    label: Files in git
    enforced_by: branch protection and change control (documented control, not compiled)
    levels: [N, R, U, A]
    help: Seed files and flows kept in git; the database row is the record.

# ── Data classes ─────────────────────────────────────────────────────────────────────
# A group has exactly one class (resource_groups.<g>.class). The class drives the invariants.
classes:
  regulated:
    label: Regulated data
    help: Records produced while making product (runs, telemetry, controller state, logs, lab results). Created once, never changed or deleted by anyone; corrections are new records.
  history:
    label: Audit history
    help: Append-only trails of who did what, including approval records and export logs. Written by functions and triggers only; readable by reviewers.
  personal:
    label: Personal data
    help: Accounts, names, e-mail addresses, unit assignments and access decisions. Administered by admin, confirmed by qa, readable by reviewers.
  config:
    label: Configuration
    help: Master data, recipes, controllers, schedules, settings, dashboards and tools. Changed under the group's approval rule.

# ── Hosts ────────────────────────────────────────────────────────────────────────────
# Which services each signed-in host exposes. A host's allowed_groups is the set of roles
# holding, on any group with a member served there, a level the member admits (any level
# but N, unless the ui member says `admit:`). Names are config.env variables. `clients`
# are the Keycloak clients whose tokens the host's services accept (azp check).
hosts:
  PORTAL_DOMAIN:    {label: Service portal,          client: portal,        serves: [portal]}
  CONFIG_DOMAIN:    {label: Configuration UI,        client: config,        serves: [config-api, platform-api, scheduler]}
  SCHEDULER_DOMAIN: {label: Scheduler,               client: scheduler,     serves: [scheduler]}
  MONITOR_DOMAIN:   {label: Monitor,                 client: monitor,       serves: [monitor]}
  DBMGMT_DOMAIN:    {label: Database Management,     client: dbmgmt,        serves: [dbmgmt]}
  ACCESS_DOMAIN:    {label: User Manager,            client: access,        serves: [access]}
  POLICY_DOMAIN:    {label: Access Policy,           client: policy,        serves: [iam]}
  MQTTX_DOMAIN:     {label: MQTT Explorer,           client: mqtt-explorer, serves: [mqtt-explorer, iam-mqttx]}
  NODE_RED_DOMAIN:  {label: Node-RED,                client: node-red,      serves: [node-red]}
  GRAFANA_DOMAIN:   {label: Grafana,                 client: grafana,       serves: [grafana]}
  WORKBENCH_DOMAIN: {label: AI Workbench,            client: workbench,     serves: [jupyterhub]}
  ONBOARD_DOMAIN:   {label: Device onboarding,       client: edge-wizard,   serves: [edge-wizard, config-api]}
  PGADMIN_DOMAIN:   {label: pgAdmin,                 client: pgadmin,       serves: [pgadmin]}

# Upstreams mounted on every signed-in host. They never count towards a host's admission
# (otherwise the profile, which every role may use, would open every host to every role),
# and they accept tokens from every client in `hosts`.
shared_upstreams:
  - {service: access-profile, path: /_account/, why: the user menu and the person's own profile on every signed-in host}

# Routes that need no platform role: health probes and the public access request. They
# are listed so that "a route missing from the table is refused" has no silent exceptions.
public_routes:
  - {service: "*", route: "GET /healthz", why: liveness probe; reveals nothing}
  - {service: access-public, route: "GET /register", why: redirect to the request-access tab of the login page}
  - {service: access-public, route: "GET /api/register/roles", why: roles a person may request}
  - {service: access-public, route: "POST /api/register", why: creates a disabled account and a pending request (CORS from the Keycloak origin only)}
  - {service: access-public, route: "OPTIONS /api/register", why: the browser's CORS preflight for the POST above; it carries no credentials and changes nothing}

# ── Network ──────────────────────────────────────────────────────────────────────────
# Who may open a connection to each application pod (IAM plan 1.4). compiler/netpol.py
# turns this into one Kubernetes NetworkPolicy per pod (label medcea/iam-netpol=true),
# which Calico enforces: anything not listed here cannot reach the pod — another pod in
# the cluster, a notebook, a forged request. Ingress only; egress is not restricted.
# Sources:
#   proxy:<HOST>   that host's oauth2-proxy (network.proxies: release name; its pods carry
#                  app.kubernetes.io/instance=<release>)
#   pod:<name>     another pod of this section
#   ingress        ingress-nginx (namespace network.ingress_namespace), for routes that are
#                  public on purpose
#   node           the node's own addresses, rendered at deploy time: kubelet probes and
#                  the host services (edge wizard, edge/src/host/platform_db.py)
# `carries` maps the route-table services a pod serves to their container port. The
# checker requires, port by port:
#   - every host that serves one of them reaches it: from its proxy, or through one pod
#     its proxy reaches (the Config UI's nginx in front of config-api and the scheduler);
#     a host in `unproxied` reaches it as the given source instead (the edge wizard runs
#     on the node, not behind a proxy);
#   - every proxy reaches each shared upstream (/_account/), except the hosts listed in
#     `no_shared_upstreams`, whose proxies do not mount it;
#   - a host that serves a carried service is in `proxies` or `unproxied`.
network:
  ingress_namespace: ingress
  unproxied:
    ONBOARD_DOMAIN: node
  no_shared_upstreams: [NODE_RED_DOMAIN]
  proxies:
    PORTAL_DOMAIN:    portal-oauth2-proxy
    CONFIG_DOMAIN:    config-oauth2-proxy
    SCHEDULER_DOMAIN: scheduler-oauth2-proxy
    MONITOR_DOMAIN:   monitor-oauth2-proxy
    DBMGMT_DOMAIN:    dbmgmt-oauth2-proxy
    ACCESS_DOMAIN:    access-oauth2-proxy
    MQTTX_DOMAIN:     mqttx-oauth2-proxy
    NODE_RED_DOMAIN:  oauth2-proxy
  pods:
    scheduler:
      selector: {app: scheduler}
      carries: {scheduler: 80}
      ingress:
        - {port: 80, from: ["proxy:SCHEDULER_DOMAIN", "pod:config-ui"], why: "the Scheduler UI; the Config UI calls /scheduler-api/ in-cluster"}
    monitor:
      selector: {app: monitor}
      carries: {monitor: 80}
      ingress:
        - {port: 80, from: ["proxy:MONITOR_DOMAIN"], why: the Monitor UI}
    dbmgmt:
      selector: {app: dbmgmt}
      carries: {dbmgmt: 80}
      ingress:
        - {port: 80, from: ["proxy:DBMGMT_DOMAIN"], why: the Database Management UI}
    config-ui:
      selector: {app: config-ui}
      carries: {platform-api: 80}
      ingress:
        - {port: 80, from: ["proxy:CONFIG_DOMAIN", node], why: the Config UI; kubelet readiness probe}
        - {port: 8081, from: [node], why: "kubelet readiness probe of platform-api (nginx reaches it on localhost)"}
    config-api:
      selector: {app: config-api}
      carries: {config-api: 3000}
      ingress:
        - {port: 3000, from: ["pod:config-ui", node], why: "PostgREST behind the Config UI's /api/; the edge wizard and platform_db.py on the host; kubelet probe"}
    access:
      selector: {app: access}
      carries: {access: 8081, access-profile: 8082, access-public: 8080}
      ingress:
        - {port: 8081, from: ["proxy:ACCESS_DOMAIN", node], why: the User Manager; kubelet liveness probe}
        - {port: 8082, from: ["proxy:PORTAL_DOMAIN", "proxy:CONFIG_DOMAIN", "proxy:SCHEDULER_DOMAIN", "proxy:MONITOR_DOMAIN",
                              "proxy:DBMGMT_DOMAIN", "proxy:ACCESS_DOMAIN", "proxy:MQTTX_DOMAIN"],
           why: "/_account/ (user menu and profile) on every host that mounts it; not Node-RED's"}
        - {port: 8080, from: [ingress, node], why: the public access request form; kubelet readiness probe}

# Functions every authenticated path needs. Granted by rule, not by the matrix (plan
# Appendix B, step 5); the catalog check I15 verifies exactly these grants. `execute`
# names database roles (db_roles below, or a role's or service's db_role); `rule:` derives
# the grantees from the policy instead. Everything else in medcea_auth and every trigger
# function is executable by its owner only. Since IAM 2.7 schema iam and access_svc are
# compiled like the rest; `cli.py compile grants --without-iam` leaves both out while the
# access component is not installed (apps/database/lib-db-apply.sh dba_iam_flag).
infrastructure_functions:
  - {function: "medcea_auth.pre_request()", execute: [anon], why: "PostgREST calls it as db-anon-role before switching. SECURITY INVOKER (SET ROLE is refused inside a definer function) and reads no table: grants.py compiles the platform roles, their composites and the allowed clients into its body. A no-op unless the database setting medcea.iam_db_roles is true, so a database-only rollback never breaks PostgREST. It takes the person's own role from the verified groups claim, exactly one, else RAISE. The single exception to I9."}
  - {function: "medcea_auth.set_actor(text, text, text, text)", execute: [svc_ingest, svc_scheduler, svc_monitor, svc_grafana, svc_dbexport, iam_svc, access_svc], why: "A service records the person (sub, person_id, name, role) whose token it verified. The sub must be a uuid and the role a platform role; the source is recorded as 'person via <service login>'."}
  - {function: "medcea_auth.set_system_actor(text, text, bigint)", execute: [svc_scheduler], why: "A triggered run acts as system:scheduler with the person and role of the schedule's (or run's) creator, looked up by id; refused when that creator is not a person."}
  - {function: "medcea_auth.my_units()", rule: own_unit, why: "The units assigned to the person behind the request (iam_policy.user_unit); read by the own_unit row-level security policies on the run tables."}
  - {function: "medcea_auth.my_zones()", rule: own_unit, why: "Every zone of the units assigned to the person (iam_policy.user_unit), zones added later included; read by the own_unit row-level security policy on medcea.measurement."}
  - {function: "medcea_auth.request_actor()", execute: [], why: "The verified actor of the transaction (set_actor/set_system_actor, or the token's claims when the session is PostgREST's authenticator); read by triggers and functions."}
  - {function: "medcea_auth._set_internal_actor(text)", execute: [], why: "migration:* and system:* actors of the deploy scripts, which run as postgres."}
  - {function: "medcea_auth.enforcing()", execute: [], why: "IAM_DB_ROLES as recorded in medcea.platform_setting."}
  - {function: "medcea_auth.policy_refuse(text)", execute: [], why: "A policy refusal: an error while IAM_DB_ROLES is true, a warning before."}
  - {function: "medcea_auth.policy_holds(text, text, text)", execute: [], why: "Compiled from the matrix: NULL, 'free' or the constraint under which a role holds a level on a group."}
  - {function: "medcea_auth.object_group(text)", execute: [], why: "Compiled from the members: the group of a table or view."}
  - {function: "medcea_auth.platform_roles()", execute: [], why: "Compiled: the eleven platform roles."}
  - {function: "medcea_auth._own_role(jsonb)", execute: [], why: "Compiled: the one own role in a groups claim, or NULL."}
  - {function: "medcea_auth._token_clients()", execute: [], why: "Compiled: the clients whose tokens PostgREST accepts (azp)."}
  - {function: "medcea_auth.row_digest(text, jsonb)", execute: [], why: "sha256 of a member row's content, compared with its last approval."}
  - {function: "medcea_auth._authors(text, jsonb)", execute: [], why: "The persons who changed a row since its last approval, from medcea.row_change."}
  - {function: "medcea_auth._approver(text)", execute: [], why: "The token-sourced person holding A on a group, or an error."}
  - {function: "medcea_auth._lock_row(text, jsonb)", execute: [], why: "The approval functions' row locks (the row, a recipe's lines, a run's cycles), taken before _authors() so authorship is read in commit order."}
  - {function: "medcea.stamp_actor()", execute: [], why: "Trigger function; runs as the table owner and overwrites created_by_*/updated_by_* with the verified actor."}
  - {function: "medcea.register_mqtt_credential(text, text, integer, text, text)", execute: [], why: "Version 1, called by the edge wizard as anon before Phase 2b. The legacy grant to anon lives in medcea_db_migrations_down_008b.sql only (IAM_DB_ROLES=false); enforce revokes it."}
  - {function: "iam_policy.append_history(text, jsonb, text)", execute: [iam_svc], why: "The only writer of the hash chain. access_svc never calls it: the iam definer functions do."}
  - {function: "iam_policy.verify_chain()", execute: [], why: "Run by health-check.sh as postgres on the host."}
  - {function: "medcea_auth._account_actor(text, text)", execute: [], why: "The one who-may rule for account decisions (a person via the User Manager holding a level on a group); called by the iam definer functions and revoke_person_mqtt."}
  - {function: "medcea_auth.role_widening(text, text)", execute: [], why: "Compiled from the matrix (model.Policy.widening, the same table as routes.json widening, stamped with its digest); called by iam.record_decision."}

# Database roles that are not a platform role or a service identity. grants.py creates
# rr_admin_login and compiles every role's privileges; medcea_owner, anon and
# authenticator are created by apps/database/deploy.sh (step 0) because the schema and
# PostgREST need them before any policy is compiled.
db_roles:
  medcea_owner: {login: false, why: "Owns every object in medcea, medcea_auth and iam_policy. NOLOGIN, no members; migrations SET ROLE to it."}
  anon: {login: false, why: "PostgREST's db-anon-role. USAGE on medcea_auth and EXECUTE on pre_request() only (the legacy grants of IAM_DB_ROLES=false live in the down file)."}
  authenticator: {login: true, password: AUTHENTICATOR_DB_PASS, why: "PostgREST's login. Member of every rr_ role with SET and without INHERIT (IAM_DB_ROLES=true). Its own password is applied in Phase 2b, together with config-api."}
  rr_admin_login: {login: true, password: RR_ADMIN_LOGIN_DB_PASS, member_of: admin, why: "pgAdmin's server entry: a member of rr_admin with INHERIT and without SET; owns nothing."}

# ── Roles ────────────────────────────────────────────────────────────────────────────
roles:
  # key = Keycloak realm role. One platform role per account (apps/access rule). Dual
  # control compares persons (person_id token claim), never accounts. includes = Keycloak
  # composite roles; each inherited cell keeps its own constraint. medcea_auth.pre_request()
  # picks db_role from the verified groups claim — never from a user attribute.
  operator:
    label: Cultivation Operator
    spec_role: R1
    availability: prototype
    db_role: rr_operator
    includes: []
    description: Runs the cultivation day to day in the units assigned to them.
    responsibilities:
      - Execute and stop runs a production manager prepared for their unit
      - Watch telemetry, runs and run logs of their own units in the Monitor
      - Read recipes and schedules to know what is coming
  production_manager:
    label: Production Manager (Process Owner)
    spec_role: R2
    availability: prototype
    db_role: rr_production_manager
    includes: [operator]
    description: Owns production planning; prepares and starts runs, assigns approved recipes and parameter sets to units.
    responsibilities:
      - Create runs and schedules, start and stop runs
      - Assign approved recipes and approved parameter sets to units (never edit them)
      - Everything an operator may do, in every unit
  maintenance:
    label: Maintenance and Calibration
    spec_role: R3
    availability: prototype
    db_role: rr_maintenance
    includes: []
    description: Replaces and calibrates boards and sensors in existing slots.
    responsibilities:
      - Re-onboard a board into a slot that already exists (never create a new slot)
      - Read telemetry, runs and device history to diagnose faults
  qc:
    label: Quality Control Analyst
    spec_role: R4
    availability: later
    db_role: rr_qc
    includes: []
    description: Tests product and records lab results (lab results arrive with the L4 entities).
    responsibilities:
      - Read runs and telemetry of the batches under test
  qa:
    label: Quality Assurance
    spec_role: R5
    availability: prototype
    db_role: rr_qa
    includes: [auditor]
    description: Independent approver of configuration, access decisions and policy changes.
    responsibilities:
      - Approve recipes, controllers, settings, master data and device changes made by someone else
      - Confirm every account grant, role widening and unit assignment an administrator makes
      - Approve every change to this policy
      - Sign off the quarterly access review; review audit trails and export evidence
  qp:
    label: Qualified / Responsible Person
    spec_role: R6
    availability: later
    db_role: rr_qp
    includes: []
    description: Releases the output of a completed run; creates and changes nothing.
    responsibilities:
      - Release completed runs they neither created nor executed
      - Read and export the run record and its histories
  engineer:
    label: Automation Engineer
    spec_role: R7
    availability: prototype
    db_role: rr_engineer
    includes: []
    description: Builds and maintains the automation — master data, devices, recipes, controllers, flows and dashboards — as drafts that qa approves.
    responsibilities:
      - Draft recipes, controllers, parameter sets and master data; onboard devices
      - Maintain Node-RED flows and Grafana dashboards
      - Commission units over MQTT while a unit is flagged for commissioning
  bio_scientist:
    label: Bio-process Scientist
    spec_role: R8
    availability: prototype
    db_role: rr_bio_scientist
    includes: []
    description: Studies the biology; reads recipes and controllers and works in the research workbench.
    responsibilities:
      - Read recipes and controllers to understand production
      - Analyse data in the AI workbench
  control_scientist:
    label: Control and AI Scientist
    spec_role: R9
    availability: prototype
    db_role: rr_control_scientist
    includes: []
    description: Designs control algorithms; reads recipes and controllers and works in the research workbench.
    responsibilities:
      - Read controller definitions and parameter sets
      - Develop and evaluate algorithms in the AI workbench
  admin:
    label: System Administrator
    spec_role: R10
    availability: prototype
    db_role: rr_admin
    includes: []
    description: Keeps the platform running and administers accounts and this policy, without access to regulated or history content (MHRA GxP data integrity 6.16). In the prototype the same person operates the host, which is break-glass access (see break_glass).
    responsibilities:
      - Administer accounts and unit assignments (every grant confirmed by qa)
      - Draft policy and settings changes (approved by qa) and run apply.sh on the host
      - Administer the workbench hub; view the schema and configuration in pgAdmin
  auditor:
    label: Auditor / Inspector
    spec_role: R11
    availability: prototype
    db_role: rr_auditor
    includes: []
    description: Reads and exports everything an inspection needs; changes nothing.
    responsibilities:
      - Read and export records, configuration and audit trails

# ── Service identities ───────────────────────────────────────────────────────────────
# Non-human identities. `ceiling` is the most each may hold; the compiler renders their
# grants from it and the catalog invariants (I10, I15) check the database against it after
# every apply. Approvals of records in medcea are made by people through PostgREST as
# their own rr_ role, so no service holds A there. The exceptions are the account, unit and
# policy approvals, which access-api and iam-api record for a person whose token they
# verified: their approval functions refuse system actors, and apply.sh re-checks every
# approver against Keycloak from the host before anything is applied.
service_identities:
  svc_ingest:
    label: Node-RED ingest flow
    description: Stores telemetry from the broker. Reads every topic; inserts measurement rows only.
    db_role: svc_ingest
    db_password: SVC_INGEST_DB_PASS
    mqtt_user: node-red
    ceiling: {master_data: [R], devices: [R], measurements: [R, C], mqtt_sense: [R], mqtt_control: [R]}
  svc_scheduler:
    label: scheduler-api.py and the runner it spawns
    description: >
      One identity: run_recipe.py and run_agent.py run as subprocesses inside the
      scheduler pod with its environment, so they cannot hold a separate credential.
      Splitting the runner into its own pod is listed in plan Section 7. devices R:
      the runner finds a unit's actuators through medcea.device and medcea.component
      (get_feedback_control_loop_params); never the credential table (service_only).
    db_role: svc_scheduler
    db_password: SVC_SCHEDULER_DB_PASS
    mqtt_user: scheduler
    ceiling: {master_data: [R], devices: [R], zones: [R], recipes: [R], controllers: [R, C, U], controllers_state: [R, C, U], schedules: [R, C, U], scheduler_settings: [R, C, U], runs: [R, C, O], run_logs: [R], mqtt_sense: [R], mqtt_control: [R, C]}
  svc_monitor:
    label: monitor-api.py
    description: Shows runs and telemetry, filtered to the person's units for operators.
    db_role: svc_monitor
    db_password: SVC_MONITOR_DB_PASS
    ceiling: {master_data: [R], devices: [R], zones: [R], recipes: [R], measurements: [R], runs: [R]}
  svc_grafana:
    label: Grafana datasource
    description: Serves dashboards; reads telemetry and runs of every unit.
    db_role: svc_grafana
    db_password: SVC_GRAFANA_DB_PASS
    ceiling: {master_data: [R], measurements: [R], runs: [R]}
  svc_dbexport:
    label: dbmgmt-api.py
    description: Exports exactly the groups where the signed-in person holds X, and logs each export.
    db_role: svc_dbexport
    db_password: SVC_DBEXPORT_DB_PASS
    ceiling: {master_data: [R, X], devices: [R, X], device_history: [R, X], recipes: [R, X], controllers: [R, X], controllers_state: [R, X], runs: [R, X], schedules: [R, X], scheduler_settings: [R, X], measurements: [R, X], iam_users: [R, X], zones: [R, X], iam_policy: [R, X], audit_histories: [R, X, C]}
  svc_mqtt_auth:
    label: Mosquitto auth sidecar
    description: Builds the broker's password and ACL files from board and person credentials.
    db_role: mqtt_auth
    managed_by: "apps/database/deploy.sh (role shell and MQTT_AUTH_DB_PASS; its grants are compiled from this ceiling)"
    ceiling: {master_data: [R], devices: [R], runs: [R], mqtt_explorer: [R]}
  svc_access:
    label: access-api.py (User Manager and profile)
    description: Account requests, decisions, role and status changes, mail settings; revokes MQTT credentials of a deactivated account. master_data R shows unit codes on the qa screen.
    db_role: access_svc
    managed_by: "apps/access/deploy.sh (role shell and password; its grants are compiled from this ceiling)"
    ceiling: {master_data: [R], iam_users: [R, C, U, A, K], zones: [R, A], mqtt_explorer: [R, U], audit_histories: [R, C]}
  svc_iam:
    label: iam-api.py (Policy UI and MQTT Explorer credentials)
    description: Policy drafts, submissions and approvals; per-person MQTT Explorer credentials.
    db_role: iam_svc
    db_password: IAM_SVC_DB_PASS
    ceiling: {iam_policy: [R, C, U, A], zones: [R, C], iam_users: [R], mqtt_explorer: [R, C, U], audit_histories: [R, C]}

# ── Resource groups ──────────────────────────────────────────────────────────────────
# Every table in medcea, iam and iam_policy is a member of exactly one group (I14, I15).
# Member forms:
#   {type: data, object: medcea.table, service_only: [svc_x]?}   tables and views; a service_only
#                                                                member gets grants from service
#                                                                ceilings only, never from a person's
#                                                                cell (its writes go through functions)
#   {type: data, object: x, written_by: functions}              people get SELECT for R/X, but their
#                                                                C/U/A compile only to EXECUTE on the
#                                                                group's function members, never to DML
# An approval rule's function is granted (EXECUTE) to the holders of A on every group whose
# rule names it, so one function can serve several groups.
#   {type: data, function: "medcea.fn(int)", level: A}             EXECUTE for holders of that level
#                                                                (`level`, not `on`: YAML 1.1 reads a bare
#                                                                `on` key as the boolean true)
#   {type: data, function: …, service_only: [svc_x]}               EXECUTE for the listed services only
#   {type: data, function: …, writes: [schema.table]}              the function is that table's only writer
#   {type: data, object: medcea.v, view: true}                     a view: SELECT only, security_invoker
#   {type: api,  service: <name>, routes: {"METHOD /path": LEVEL}}
#   {type: ui,   host: <hosts key>, admit: [levels]?}             admit defaults to every level but N
#   {type: mqtt, topic: <pattern>}
#   {type: idp | infra | code, object: <text>}
# `reaches` lists what a tool lets its user touch beyond its own members (with the tool's
# own credential); `mirrors` marks a tool that acts with the person's own cells only.
resource_groups:
  portal:
    label: Service portal and profile
    class: config
    description: The landing page with the service cards, and the user menu with the person's own profile.
    why_this_class: Navigation and self-service; holds no records of others.
    risk: None beyond knowing which services exist. The profile acts on the signed-in person's own account only.
    members:
      - {type: ui, host: PORTAL_DOMAIN}
      - {type: api, service: access-profile, routes: {"GET /_account/": R, "GET /_account/user-menu.js": R, "GET /_account/api/me": R, "POST /_account/api/me": R}}

  user_manager:
    label: User Manager page
    class: config
    description: The User Manager's page and the signed-in person's own capabilities. Every list and action is a route of iam_users, zones or audit_histories.
    why_this_class: Navigation; holds no records.
    risk: None; it shows which tabs exist.
    members:
      - {type: api, service: access, routes: {"GET /": R, "GET /api/me": R}}

  master_data:
    label: Master data (locations, units, zones, components)
    class: config
    description: The physical plant as the platform knows it — sites, cultivation units, zones and installed components.
    why_this_class: Defines the plant; changes are configuration, reviewed by qa.
    risk: A wrong unit or zone code misroutes telemetry and commands. Setting a unit's commissioning flag opens MQTT write to it, so that one change waits for qa.
    approval:
      record: medcea.approval (table, row id, row hash, approver)
      functions: ["medcea.approve_change(text, bigint, text)"]
      effect: review
      help: QA confirms each change after the fact; an unconfirmed change is listed on the QA queue but blocks nothing — except cea_unit.commissioning, which takes effect only after qa confirms it.
    members:
      - {type: data, object: medcea.cea_location}
      - {type: data, object: medcea.cea_unit}
      - {type: data, object: medcea.cea_zone}
      - {type: data, object: medcea.component}
      - {type: data, function: "medcea.approve_change(text, bigint, text)", level: A, note: "a review of a master_data or devices row (row id), or the approval of a pending_change (its id), which applies it"}
      - {type: data, function: "medcea.propose_commissioning(int, boolean, text)", level: U, writes: [medcea.pending_change], note: "cea_unit.commissioning changes only through approve_change()"}
      - type: api
        service: platform-api
        routes: {"GET /locations": R, "GET /locations/<file>": R, "PUT /locations/<file>": U, "GET /units": R, "GET /units/<file>": R, "PUT /units/<file>": U}
      - {type: code, object: "apps/frontend/locations/*.json, apps/frontend/units/*.json (seed files served by platform-api)"}
      - {type: api, service: scheduler, routes: {"GET /api/units": R}}

  devices:
    label: Devices and provisioning
    class: config
    description: The boards in each slot and their MQTT identity.
    why_this_class: Configuration of the fleet; the credential hashes are readable by the broker only.
    risk: A board in the wrong slot publishes another zone's telemetry; a stolen credential forges telemetry.
    approval:
      record: medcea.approval
      functions: ["medcea.approve_change(text, bigint, text)"]
      effect: review
      help: QA confirms each onboarding or move after the fact.
    members:
      - {type: data, object: medcea.device}
      - {type: data, object: medcea.mqtt_credential, service_only: [svc_mqtt_auth]}
      - {type: data, function: "medcea.register_mqtt_credential(int, text, text)", level: C, note: "takes the device id, the board's serial and the hash; refuses unless the serial equals the device row's, and derives user, role and topic from the row"}
      - type: api
        service: platform-api
        routes: {"GET /devices": R, "GET /devices/<file>": R, "PUT /devices/<file>": U, "GET /check/<host>": R, "GET /check/<host>/<port>": R}
      - {type: code, object: "apps/frontend/devices/*.json (seed files served by platform-api)"}

  onboarding:
    label: Device onboarding (edge wizard)
    class: config
    description: The browser wizard that flashes a board over USB and registers it in a slot.
    why_this_class: A tool for devices; the records it writes belong to devices.
    risk: Flashing erases a board before anything is registered, so the page is offered only to people who may register boards.
    members:
      - {type: ui, host: ONBOARD_DOMAIN, admit: [C, U]}

  device_history:
    label: Device placement history
    class: history
    description: Every placement, move, rename and removal of a board, written by trigger.
    why_this_class: Audit trail of the fleet.
    risk: None if append-only; losing it loses provenance of telemetry.
    members:
      - {type: data, object: medcea.device_slot_history}

  recipes:
    label: Recipes and recipe-to-unit assignment
    class: config
    description: Growth recipes, their lines, and which approved recipe may run on which unit with which approved parameter set.
    why_this_class: Process definition; approved before use.
    risk: An unapproved or altered recipe changes product conditions.
    approval:
      record: medcea.recipe.status (draft → approved → in_use → retired)
      functions: ["medcea.approve_recipe(int)"]
      effect: blocking
      help: The scheduler refuses to assign or run a recipe that is not approved; an approved recipe cannot be edited.
    members:
      - {type: data, object: medcea.recipe}
      - {type: data, object: medcea.recipe_line}
      - {type: data, object: medcea.recipe_unit_permission}
      - {type: data, function: "medcea.approve_recipe(int)", level: A}
      - {type: api, service: scheduler, routes: {"GET /api/recipes": R}}
      - {type: api, service: platform-api, routes: {"GET /": R, "GET /<file>": R, "PUT /<file>": U}}
      - {type: code, object: apps/frontend/recipes/*.json}

  controllers:
    label: Controllers and parameter sets
    class: config
    description: The control-algorithm catalogue and the approved parameter sets that recipe assignments and schedules point to.
    why_this_class: Process definition; approved before use.
    risk: A changed parameter changes how the chamber is driven.
    approval:
      record: medcea.control_algorithm.status, medcea.unit_algorithm_params.status
      functions: ["medcea.approve_algorithm(int)", "medcea.approve_params(int)"]
      effect: blocking
      help: A run uses only approved algorithms and approved parameter sets; schedules and assignments reference a parameter set, never inline parameters.
    members:
      - {type: data, object: medcea.control_algorithm}
      - {type: data, object: medcea.unit_algorithm_params, note: "replaces recipe_unit_permission.algorithm_params and schedule.algorithm_params (migration 008)"}
      - {type: data, function: "medcea.approve_algorithm(int)", level: A}
      - {type: data, function: "medcea.approve_params(int)", level: A}
      - {type: api, service: scheduler, routes: {"GET /api/algorithms": R, "PUT /api/algorithms/<id>": U, "GET /api/param-sets": R}}
      - {type: code, object: schd/cea/algorithms/*}

  controllers_state:
    label: Persisted controller state (Q-tables)
    class: regulated
    description: What a learning controller learnt during production, kept between runs.
    why_this_class: Produced during a batch; it shapes how the next batch is driven.
    risk: Editing or deleting it silently changes process behaviour.
    approval:
      record: medcea.algorithm_state_event ('retired', append-only)
      functions: ["medcea.retire_algorithm_state(int, text, text)"]
      effect: blocking
      help: Retiring state is an approved, recorded event; the next run starts cold. Nothing is deleted.
    members:
      - {type: data, object: medcea.algorithm_state}
      - {type: data, object: medcea.algorithm_state_event, written_by: functions}
      - {type: data, function: "medcea.retire_algorithm_state(int, text, text)", level: A, writes: [medcea.algorithm_state_event]}
      - {type: api, service: scheduler, routes: {"GET /api/units/<id>/algorithm-state/<algorithm>": R}}

  runs:
    label: Recipe runs and cycle runs
    class: regulated
    description: Every execution of a recipe on a unit, each of its cycles, and its release.
    why_this_class: The production record.
    risk: A forged or edited run breaks the batch record.
    approval:
      record: medcea.run_release
      functions: ["medcea.release_run(int)"]
      effect: blocking
      help: Release of a completed run by a person who neither created nor executed it.
    members:
      - {type: data, object: medcea.recipe_run}
      - {type: data, object: medcea.recipe_line_cycle_run, written_by: functions}
      - {type: data, object: medcea.run_release, written_by: functions}
      - {type: data, object: medcea.run_history, view: true}
      - {type: data, object: medcea.run_watch, view: true}
      - {type: data, function: "medcea.start_run(int)", level: O}
      - {type: data, function: "medcea.set_run_status(int, text)", level: O}
      - {type: data, function: "medcea.finish_run(int, text)", level: C, service_only: [svc_scheduler]}
      - {type: data, function: "medcea.record_cycle(int, jsonb)", level: C, service_only: [svc_scheduler], writes: [medcea.recipe_line_cycle_run]}
      - {type: data, function: "medcea.release_run(int)", level: A, writes: [medcea.run_release]}
      - type: api
        service: scheduler
        routes:
          "GET /api/runs": R
          "GET /api/runs/active": R
          "GET /api/runs/<id>": R
          "GET /api/runs/<id>/cycles": R
          "POST /api/runs": C
          "POST /api/runs/<id>/execute": O
          "POST /api/runs/<id>/stop": O
          "PATCH /api/runs/<id>/status": O
          "POST /api/schedules/<id>/trigger": O
      - {type: api, service: monitor, routes: {"GET /api/runs": R, "GET /api/run/<id>": R}}

  schedules:
    label: Schedules
    class: config
    description: When runs are created and started automatically, with which approved parameter set.
    why_this_class: Planning configuration.
    risk: A wrong schedule starts a run at the wrong time.
    members:
      - {type: data, object: medcea.schedule}
      - {type: data, function: "medcea.retire_schedule(int)", level: U, note: "DELETE /api/schedules/<id> retires: the schedule stops firing and is kept; a retired schedule cannot be edited"}
      - type: api
        service: scheduler
        routes:
          "GET /api/schedules": R
          "POST /api/schedules": C
          "PUT /api/schedules/<id>": U
          "DELETE /api/schedules/<id>": U
      - {type: ui, host: SCHEDULER_DOMAIN}

  scheduler_settings:
    label: Scheduler settings (log retention)
    class: config
    description: How long run logs are kept and when they are compressed.
    why_this_class: Configuration of how regulated logs are retained.
    risk: A shorter retention destroys run logs. The minimum retention is a database CHECK, and every change waits for qa.
    approval:
      record: medcea.approval
      functions: ["medcea.approve_change(text, bigint, text)"]
      effect: blocking
      help: A new retention setting applies only after a qa person other than its author confirms it.
    members:
      - {type: data, object: medcea.scheduler_config, written_by: functions}
      - {type: data, function: "medcea.propose_setting(text, jsonb)", level: U, writes: [medcea.pending_change], note: "a pending setting; it applies after approve_change()"}
      - {type: api, service: scheduler, routes: {"GET /api/config/logs": R, "PUT /api/config/logs": U}}

  measurements:
    label: Telemetry
    class: regulated
    description: Every sensor reading, setpoint and control action stored by the ingest flow, stamped at insert with the zone of the board that sent it.
    why_this_class: The primary production record.
    risk: Edited telemetry falsifies the batch record.
    members:
      - {type: data, object: medcea.measurement}
      - {type: data, object: medcea.backup_remote_to_insert_measurement, service_only: [svc_ingest]}
      - {type: data, object: medcea.msg_actual_points, view: true}
      - {type: data, object: medcea.msg_set_points, view: true}
      - {type: data, object: medcea.msg_controls, view: true}
      - {type: data, object: medcea.v_ap_measurements, view: true}
      - {type: data, object: medcea.v_sp_measurements, view: true}
      - {type: data, object: medcea.v_ct_measurements, view: true}
      - {type: api, service: monitor, routes: {"GET /api/measurements/<unit>": R, "GET /api/actions/<unit>": R}}
      - {type: ui, host: MONITOR_DOMAIN}

  run_logs:
    label: Run logs
    class: regulated
    description: The runner's log file per run, kept and compressed by the scheduler according to scheduler_settings.
    why_this_class: Part of the run record.
    risk: A deleted log loses evidence of what the controller did. No person can delete or compress logs; the scheduler does it as a system job.
    members:
      - {type: api, service: scheduler, routes: {"GET /api/runs/<id>/log": R}}

  dashboards:
    label: Grafana dashboards
    class: config
    description: Production dashboards over telemetry and runs.
    why_this_class: Presentation configuration.
    risk: Dashboards read regulated data through Grafana's own database account, so a dashboard viewer reads telemetry of every unit.
    reaches: {measurements: [R], runs: [R]}
    members:
      - {type: ui, host: GRAFANA_DOMAIN}
      - {type: code, object: apps/report/dashboards/*.json}

  flows:
    label: Node-RED flows
    class: config
    description: The ingest flow and any other Node-RED flow, edited in the Node-RED editor.
    why_this_class: Integration configuration.
    risk: The editor runs code with the ingest account, so an editor reads all topics and can write telemetry rows.
    reaches: {mqtt_sense: [R], mqtt_control: [R], measurements: [R, C]}
    members:
      - {type: ui, host: NODE_RED_DOMAIN}
      - {type: code, object: apps/node-red/flows/*.json}

  mqtt_sense:
    label: Telemetry topics
    class: regulated
    description: "<root>/<unit>/<zone>/sense/# — what the boards publish."
    why_this_class: Live production data in transit.
    risk: Reading reveals production data; publishing forges it.
    members:
      - {type: mqtt, topic: "medcea/+/+/sense/#"}

  mqtt_control:
    label: Command and setpoint topics
    class: regulated
    description: "<root>/<unit>/<zone>/control/# and control_setpoint/# — commands to equipment and what it reports back."
    why_this_class: Drives the equipment during production.
    risk: Publishing switches relays in a live chamber.
    members:
      - {type: mqtt, topic: "medcea/+/+/control/#"}
      - {type: mqtt, topic: "medcea/+/+/control_setpoint/#"}

  mqtt_explorer:
    label: MQTT Explorer
    class: config
    description: The browser MQTT tool and the per-person credentials it connects with.
    why_this_class: A tool; the data it shows belongs to the topic groups.
    risk: None beyond the person's own topic rights. The credential mirrors the person's mqtt_sense and mqtt_control cells, is rebuilt on every broker sync, and dies at once when the account is deactivated, the role changes or the unit leaves commissioning.
    mirrors: [mqtt_sense, mqtt_control]
    members:
      - {type: ui, host: MQTTX_DOMAIN}
      - {type: api, service: iam-mqttx, routes: {"POST /_mqtt-credential": R}}
      - {type: data, object: medcea.mqtt_service_credential, service_only: [svc_mqtt_auth, svc_iam]}
      - {type: data, object: medcea.mqtt_service_acl, service_only: [svc_mqtt_auth, svc_iam]}
      - {type: data, function: "medcea.revoke_person_mqtt(uuid, text)", level: U, service_only: [svc_access], note: "deactivation and a pure narrowing set the person's credentials inactive in the same transaction; an owner definer, so access_svc reads no credential (no `writes:`: svc_iam keeps its DML)"}

  db_export:
    label: Database Management export
    class: config
    description: Lists database objects and exports their definition and data.
    why_this_class: A tool; the data it exports belongs to the groups it covers.
    risk: An export takes a copy out of the platform. It covers exactly the groups where the person holds X, and every export is logged.
    mirrors: [master_data, devices, device_history, recipes, controllers, controllers_state, runs, schedules, scheduler_settings, measurements, iam_users, zones, iam_policy, audit_histories]
    members:
      - {type: api, service: dbmgmt, routes: {"GET /objects": X, "POST /export": X}}
      - {type: ui, host: DBMGMT_DOMAIN}

  iam_users:
    label: Accounts, roles and access requests
    class: personal
    description: Keycloak accounts, their platform role and person, access requests and decisions, and the User Manager's mail settings.
    why_this_class: Personal data and the keys to the platform.
    risk: A wrong role or unit grants access to regulated data; a missed deactivation leaves a leaver inside.
    approval:
      record: iam.account_decision (pending_qa → confirmed | refused; applied → reviewed)
      functions: ["iam.confirm_decision(int, text)", "iam.refuse_decision(int, text)", "iam.review_decision(int, text)"]
      effect: blocking
      help: >
        A grant, a role change that adds any (group, level) pair the old role did not
        have, any activation (an enabled account reaches the hosts not yet gated by
        role, Grafana until IAM 3.1, even without a platform role), a new unit assignment, a
        person_id change or a change of the mail settings takes effect only when a qa
        person confirms it who is neither the administrator who made it nor its subject.
        Deactivation, a pure narrowing and the removal of a unit act at once and are
        reviewed afterwards.
    members:
      - {type: idp, object: "keycloak realm users, realm-role mappings and the person_id attribute"}
      - {type: data, object: iam.access_request}
      - {type: data, object: iam.account_decision, written_by: functions}
      - {type: data, object: iam.mail_settings, service_only: [svc_access], written_by: functions, note: "changed only by iam.confirm_decision (a qa-confirmed mail_settings decision); access_svc reads it to send"}
      - {type: data, object: iam.mail_settings_pending, service_only: [svc_access], note: "a mail settings change waiting for qa; moved to iam.mail_settings (or deleted) by the decision functions"}
      - {type: data, object: iam.mail_template, note: "reset to default is an UPDATE to the default text (is_default), not a DELETE"}
      - {type: data, function: "iam.record_decision(text, text, text, text, text, text, text, text, bigint)", level: K, service_only: [svc_access], writes: [iam.account_decision, iam.user_status_history], note: "an admin's proposal; pending_qa when it widens (medcea_auth.role_widening), else applied"}
      - {type: data, function: "iam.withdraw_decision(int, text)", level: K, service_only: [svc_access], writes: [iam.account_decision]}
      - {type: data, function: "iam.confirm_decision(int, text)", level: A, service_only: [svc_access], writes: [iam.account_decision, iam.user_status_history, iam.mail_settings, iam_policy.user_unit], note: "confirming a unit_assign inserts the user_unit row (a no-op for one already in effect: bootstrap, backfill)"}
      - {type: data, function: "iam.refuse_decision(int, text)", level: A, service_only: [svc_access], writes: [iam.account_decision, iam_policy.user_unit], note: "refusing a unit_assign deletes the user_unit row, only while it is the latest unit decision"}
      - {type: data, function: "iam.review_decision(int, text)", level: A, service_only: [svc_access], writes: [iam.account_decision]}
      - type: api
        service: access
        routes:
          "GET /api/decisions": [R, K]
          "GET /api/users": K
          "GET /api/requests": K
          "POST /api/requests/<id>/decision": K
          "POST /api/users/<id>/status": K
          "POST /api/users/<id>/role": K
          "POST /api/users/<id>/person": K
          "GET /api/settings": K
          "POST /api/settings": K
          "POST /api/settings/test": K
          "GET /api/templates": K
          "POST /api/templates/<name>": K
          "POST /api/templates/<name>/reset": K
          "POST /api/decisions/<id>/confirm": A
          "POST /api/decisions/<id>/refuse": A
          "POST /api/decisions/<id>/review": A
          "POST /api/decisions/<id>/withdraw": K
      - {type: ui, host: ACCESS_DOMAIN}

  zones:
    label: Unit assignments
    class: personal
    description: Which units each operator works in; the own_unit constraint reads it (every zone of an assigned unit, zones added later included).
    why_this_class: A per-person access attribute.
    risk: A new unit gives an operator telemetry, runs and run execution in that unit, so assignments wait for qa; removals act at once.
    approval:
      record: iam.account_decision (pending_qa → confirmed | refused; applied → reviewed)
      functions: ["iam.confirm_decision(int, text)", "iam.refuse_decision(int, text)", "iam.review_decision(int, text)"]
      effect: blocking
      help: A new unit assignment takes effect when a qa person who is neither the maker nor the subject confirms it — apps/iam/units.sh assign --by <username> records it as pending_qa, and the User Manager's Decisions tab confirms it (the unit is assigned then) or refuses it (nothing is applied); units.sh remove withdraws one still waiting. Bootstrap exception (like the policy's --bootstrap) — units.sh assign --bootstrap, allowed only while no other enabled qa account could confirm, applies the assignment at once and records it as pending_qa; a refusal then removes the unit while it is the latest decision for that user and unit.
    members:
      - {type: data, object: iam_policy.user_unit, written_by: functions}
      - {type: data, object: iam_policy.user_zone, written_by: functions, note: "unused since unit assignments; kept for the history that names it"}
      - {type: data, function: "iam_policy.propose_unit(uuid, int, text)", level: C, service_only: [svc_iam], note: "IAM 4.3: called by iam-api for an admin holding K; records a pending decision; removal is immediate. Until then apps/iam/units.sh is the only assigner"}
      - {type: api, service: iam, routes: {"GET /api/zones": [R, K], "PUT /api/zones": K}}

  iam_policy:
    label: Access policy
    class: config
    description: This policy and its versions.
    why_this_class: Configuration of access; every change needs qa approval.
    risk: A policy change can open any group to any role.
    approval:
      record: iam_policy.version.status (draft → submitted → approved → applied)
      functions: ["iam_policy.approve(int, text)"]
      effect: blocking
      help: apply.sh applies only an approved version; the approver is a different person from the submitter, and the version must not widen the approver's own role.
    members:
      - {type: data, object: iam_policy.version, written_by: functions}
      - {type: data, object: iam_policy.entry, written_by: functions}
      - {type: data, object: iam_policy.waiver, written_by: functions}
      - {type: data, function: "iam_policy.new_draft(int, text)", level: C}
      - {type: data, function: "iam_policy.save_entry(int, text, text, text[], text, text[], text)", level: U}
      - {type: data, function: "iam_policy.submit(int, text)", level: U}
      - {type: data, function: "iam_policy.approve(int, text)", level: A}
      - {type: data, object: iam_policy.role, service_only: [svc_iam]}
      - {type: data, object: iam_policy.resource_group, service_only: [svc_iam]}
      - {type: data, object: iam_policy.member, service_only: [svc_iam]}
      - {type: data, object: iam_policy.effective_route, service_only: [svc_iam]}
      - type: api
        service: iam
        routes:
          "GET /api/policy/<v>": R
          "GET /api/policy/<v>/explain": R
          "GET /api/policy/<v>/diff": R
          "GET /api/policy/who-can": R
          "POST /api/policy/draft": C
          "PUT /api/policy/<v>/entry": U
          "POST /api/policy/<v>/submit": U
          "POST /api/policy/<v>/approve": A
      - {type: ui, host: POLICY_DOMAIN}

  audit_histories:
    label: Audit histories and approval records
    class: history
    description: Append-only trails — access requests, account status and role changes, mail configuration, policy changes, approvals, exports and access reviews.
    why_this_class: The audit trail.
    risk: None if append-only; losing it loses attributability.
    members:
      - {type: data, object: iam.access_request_history, written_by: functions}
      - {type: data, object: iam.user_status_history, written_by: functions}
      - {type: data, object: iam.config_history, written_by: functions}
      - {type: data, object: iam.access_review, written_by: functions}
      - {type: data, object: iam_policy.history, written_by: functions}
      - {type: data, object: iam_policy.export_log, written_by: functions}
      - {type: data, object: medcea.approval, written_by: functions}
      - {type: data, object: medcea.pending_change, written_by: functions, note: "blocking changes waiting for approve_change() (retention, commissioning)"}
      - {type: data, object: medcea.row_change, written_by: functions, note: "every change to the 14 attributed tables; not_own_author reads it"}
      - {type: data, function: "iam_policy.log_export(text[], text[])", level: C, service_only: [svc_dbexport], writes: [iam_policy.export_log]}
      - {type: data, function: "iam.create_review(jsonb)", level: C, service_only: [svc_access], writes: [iam.access_review], note: "the quarter's snapshot; the database adds units, decisions, the switches it holds and the chain verdict itself"}
      - {type: data, function: "iam.sign_off_review(int, text)", level: C, service_only: [svc_access], writes: [iam.access_review], note: "the creator may sign off (one qa person: a known single-person control)"}
      - type: api
        service: access
        routes:
          "GET /api/users/<id>/history": R
          "GET /api/requests/<id>/history": R
          "GET /api/config-history": R
          "GET /api/review": R
          "GET /api/review/<id>": R
          "POST /api/review": C
          "POST /api/review/<id>/sign-off": C
      - {type: api, service: iam, routes: {"GET /api/policy/history": R}}

  research_workbench:
    label: AI Workbench (JupyterHub)
    class: config
    description: Notebooks for analysis and algorithm development.
    why_this_class: Research environment, outside the production record.
    risk: Notebooks run code; their pods are isolated by NetworkPolicy, so the workbench reaches no platform service or database.
    members:
      - {type: ui, host: WORKBENCH_DOMAIN}

  platform_admin:
    label: Platform administration
    class: config
    description: The schema and configuration, viewed in pgAdmin with the administrator's own database role; the host-side deploy scripts.
    why_this_class: Infrastructure configuration.
    risk: pgAdmin connects as rr_admin_login (a member of rr_admin), which owns nothing and reads only what the admin column grants; schema changes happen only as migrations run by the locked deploy scripts.
    members:
      - {type: ui, host: PGADMIN_DOMAIN}
      - {type: data, object: medcea.platform_setting, service_only: [], note: "the MQTT topic root (PROJECT_NAME), written by apps/database/deploy.sh"}
      - {type: infra, object: "microk8s, helm, config.env, .ca/, deploy scripts under medcea_lock (break-glass)"}

# Identities that sit outside the matrix on purpose. In the prototype the admin person also
# operates the host, so their host access reaches every one of these: that is stated here,
# not hidden, and every use is logged. Separating the host operator from the admin role is
# plan Section 7.
break_glass:
  - {identity: "postgres (superuser)", used_by: "deploy scripts and apply.sh on the host", logged_by: "ALTER ROLE postgres IN DATABASE medcea_db SET log_statement = 'all' (Keycloak's own database is not affected); logs/ of every locked script"}
  - {identity: "Keycloak master-realm admin", used_by: "deploy-infra.sh and recovery", logged_by: "Keycloak admin events, enabled by deploy-infra.sh; role mappings not made through the User Manager are flagged by health-check.sh"}
  - {identity: "Grafana local admin", used_by: "recovery only", logged_by: "Grafana server log"}
  - {identity: "pgAdmin internal admin (PGADMIN_DEFAULT_EMAIL)", used_by: "recovery when Keycloak is down (internal authentication switched on by hand)", logged_by: "pgAdmin log"}
  - {identity: "host sudo / kubeconfig", used_by: "deploy scripts", logged_by: "logs/ of every locked script"}

