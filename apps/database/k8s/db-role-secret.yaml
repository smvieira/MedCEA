# One database role's credentials (IAM plan 3.6), written by apps/database/deploy.sh:
#   render apps/database/k8s/db-role-secret.yaml SECRET_NAME DB_ROLE DB_PASS | kubectl apply -f -
# Nothing mounts these in Phase 2a; 2.5 points each service at its own.
apiVersion: v1
kind: Secret
metadata:
  name: ${SECRET_NAME}
  labels:
    medcea/db-role: "true"
type: Opaque
stringData:
  username: "${DB_ROLE}"
  password: "${DB_PASS}"
