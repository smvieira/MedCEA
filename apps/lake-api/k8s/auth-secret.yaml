# The login of lake-api's PostgREST to the research database (rs_lake_api).
# Render list: RESEARCH_NAMESPACE RS_LAKE_API_DB_PASS
#   render apps/lake-api/k8s/auth-secret.yaml RESEARCH_NAMESPACE RS_LAKE_API_DB_PASS | kubectl apply -f -
# The value reaches envsubst through its environment and kubectl on stdin, never argv.
# apps/research/deploy.sh sets the role's password (a SCRAM verifier) from the same
# config.env value; the Deployment reads the key at container start only, so a changed
# Secret restarts the pod through its medcea/auth-secret-version annotation.
apiVersion: v1
kind: Secret
metadata:
  name: lake-api-auth
  namespace: ${RESEARCH_NAMESPACE}
  labels:
    app: lake-api
    app.kubernetes.io/part-of: medcea-research
type: Opaque
stringData:
  password: "${RS_LAKE_API_DB_PASS}"
