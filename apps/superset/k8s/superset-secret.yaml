# apps/superset/k8s/superset-secret.yaml — Superset's secrets, rendered by
# apps/superset/deploy.sh from config.env (render list: NAMESPACE SUPERSET_SECRET_KEY
# SUPERSET_META_DB_PASS SUPERSET_CLIENT_SECRET SUPERSET_ROLES_MAPPING) and applied
# server-side (field manager medcea-superset), so no last-applied annotation copies it.
# The pods read every key as a secretKeyRef env, never as a plain value; a secretKeyRef
# is read at container start only, so the sha256 of this document (with ConfigMap
# superset-config) is the pod annotation medcea/config-checksum.
#
# SUPERSET_ROLES_MAPPING is not a secret: it is `cli.py compile superset` ({realm role: Superset
# roles}), kept here so the Deployment carries no plain copy to drift from it;
# ./apps/superset/deploy.sh --gate-only and health-check compare it with the compile.
apiVersion: v1
kind: Secret
metadata:
  name: superset-secrets
  namespace: ${NAMESPACE}
  labels:
    app: superset
type: Opaque
stringData:
  SUPERSET_SECRET_KEY: "${SUPERSET_SECRET_KEY}"
  SUPERSET_META_DB_PASS: "${SUPERSET_META_DB_PASS}"
  SUPERSET_CLIENT_SECRET: "${SUPERSET_CLIENT_SECRET}"
  SUPERSET_ROLES_MAPPING: '${SUPERSET_ROLES_MAPPING}'
