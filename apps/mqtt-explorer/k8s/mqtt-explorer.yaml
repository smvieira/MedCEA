---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqtt-explorer
  namespace: ${NAMESPACE}
  labels:
    app: mqtt-explorer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mqtt-explorer
  template:
    metadata:
      labels:
        app: mqtt-explorer
    spec:
      containers:
      - name: nginx
        image: nginx:1.27-alpine
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "32Mi"
            cpu: "50m"
          limits:
            memory: "64Mi"
            cpu: "200m"
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html/index.html
          subPath: index.html
      volumes:
      - name: html
        configMap:
          name: mqtt-explorer-html
---
apiVersion: v1
kind: Service
metadata:
  name: mqtt-explorer
  namespace: ${NAMESPACE}
spec:
  selector:
    app: mqtt-explorer
  ports:
  - name: http
    port: 80
    targetPort: 80
  type: ClusterIP
# No Ingress here: the host ${MQTTX_DOMAIN} belongs to mqttx-oauth2-proxy
# (deploy.sh), which upstreams to this Service and, at /mqtt, to the broker's
# WebSocket listener (Service mosquitto-ws).
