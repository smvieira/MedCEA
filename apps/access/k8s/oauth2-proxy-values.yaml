configuration:
  content: |
    provider = "oidc"
    provider_display_name = "Keycloak"
    email_domains = ["*"]
    cookie_secure = true
    ssl_insecure_skip_verify = true
    # Same session limits as the portal proxy (k8s/oauth2-proxy/values-portal.yaml):
    # re-check with Keycloak every 4 minutes, so removing someone's admin role
    # or session takes effect quickly.
    cookie_refresh = "4m"
    cookie_expire = "8h"
    # Go straight to the Keycloak login.
    skip_provider_button = true
    # The roles the access policy compiles for ACCESS_DOMAIN (admin, qa, qp,
    # auditor), rendered by apps/access/deploy.sh only once every access pod has
    # proved it enforces its route table; ["admin"] until then, and under
    # IAM_GATES=false (IAM 2.7, invariant W). deploy-infra.sh maps realm roles
    # into a "groups" claim on the access client; oauth2-proxy answers 403 to
    # anyone signed in without one of them.
    oidc_groups_claim = "groups"
    allowed_groups = ${ALLOWED_GROUPS}
    # CSRF: the session cookie is not sent on a cross-site POST. Lax, not
    # Strict: Strict would drop it on the top-level return from Keycloak's login.
    # access-api also requires application/json and a same-origin Origin.
    cookie_samesite = "lax"
    # The 403 page, as in k8s/oauth2-proxy/values-app.yaml.
    custom_templates_dir = "/templates"
    # access-api.py takes the person from the verified access token (IAM 2.7),
    # never from these headers; the profile upstream (/_account/) still reads
    # X-Forwarded-Preferred-Username, which oauth2-proxy strips from the client.
    pass_user_headers = true
    pass_basic_auth = false
    pass_authorization_header = false
    # X-Forwarded-Access-Token: the token medcea_iam.check() verifies in every
    # service behind this proxy, /_account/ included (IAM plan 1.3). Not as
    # Authorization, which PostgREST would try to verify before Phase 2.
    pass_access_token = true
    # Explicit in-cluster URLs; pods cannot resolve a name-based domain (see the
    # portal and config proxies).
    skip_oidc_discovery = true
    login_url = "https://${KEYCLOAK_DOMAIN}/realms/${KEYCLOAK_REALM}/protocol/openid-connect/auth"
    redeem_url = "http://keycloak.${NAMESPACE}.svc.cluster.local/realms/${KEYCLOAK_REALM}/protocol/openid-connect/token"
    oidc_jwks_url = "http://keycloak.${NAMESPACE}.svc.cluster.local/realms/${KEYCLOAK_REALM}/protocol/openid-connect/certs"
    profile_url = "http://keycloak.${NAMESPACE}.svc.cluster.local/realms/${KEYCLOAK_REALM}/protocol/openid-connect/userinfo"
    # /_account/ is the user menu and profile (apps/access, :8082), mounted on
    # every signed-in host so it acts for whoever this proxy signed in.
    upstreams = ["http://access-admin.${NAMESPACE}.svc.cluster.local:80", "http://access-profile.${NAMESPACE}.svc.cluster.local:80/_account/"]
