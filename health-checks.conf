# MedCEA Health Checks
# =============================================================================
# Format:  Name | type | target | [options]
#
# Types:
#   k8s    Kubernetes workload readiness via rollout status
#          target: NAMESPACE/KIND/NAME
#          (kind: deployment, statefulset, daemonset)
#
#   http   HTTP/HTTPS GET — expects 2xx unless overridden
#          target: URL  (may reference $VARS from config.env)
#          options: skip_tls        skip TLS certificate verification
#                   expect=CODE     expected status code or pattern (2xx, 30x, 302, etc.)
#
#   tcp    TCP port reachability
#          target: HOST:PORT
#
#   juju   Juju application unit status
#          target: application-name
#
# Variables from config.env are expanded in the target field.
# Lines starting with # and blank lines are ignored.
# =============================================================================

# --- Core infrastructure ---
PostgreSQL               | k8s   | $NAMESPACE/statefulset/rdbms-postgresql   |
Access policy history    | iamchain | $POSTGRES_DB                          |
Database roles mode      | iamdbroles | $POSTGRES_DB                        |
Database grants          | iamgrants | $POSTGRES_DB                         |
Keycloak                 | k8s   | $NAMESPACE/deployment/keycloak             |
Keycloak HTTPS           | http  | https://$KEYCLOAK_DOMAIN/realms/master     | skip_tls
Mosquitto                | k8s   | $NAMESPACE/deployment/mosquitto            |
Mosquitto MQTT (TCP)     | tcp   | localhost:31883                            |
# 31901 (WebSocket NodePort) is gone: browsers reach the broker only as
# wss://$MQTTX_DOMAIN/mqtt, through the explorer's sign-in.

# --- Application services ---
Node-RED                 | k8s   | $NAMESPACE/deployment/node-red             |
OAuth2 Proxy (Node-RED)  | k8s   | $NAMESPACE/deployment/oauth2-proxy        |
# Signed-in hosts redirect an anonymous request straight to the Keycloak
# login page (skip_provider_button), so 30x is the healthy answer.
Node-RED UI              | http  | https://$NODE_RED_DOMAIN                    | expect=30x
Grafana                  | k8s   | $NAMESPACE/deployment/grafana              |
Grafana UI               | http  | https://$GRAFANA_DOMAIN/api/health          |
pgAdmin                  | k8s   | $NAMESPACE/deployment/pgadmin              |
pgAdmin UI               | http  | https://$PGADMIN_DOMAIN/misc/ping           |
MQTT Explorer            | k8s   | $NAMESPACE/deployment/mqtt-explorer        |
MQTT Explorer proxy      | k8s   | $NAMESPACE/deployment/mqttx-oauth2-proxy   |
MQTT Explorer UI         | http  | https://$MQTTX_DOMAIN                       | expect=30x
Config UI proxy          | k8s   | $NAMESPACE/deployment/config-oauth2-proxy  |
Config UI                | http  | https://$CONFIG_DOMAIN                      | expect=30x
# WARN while IAM_POSTGREST_JWT=false (Phase 2b not on); FAIL on a stale realm key.
PostgREST tokens         | postgrest | $NAMESPACE                          |
DB Mgmt                  | k8s   | $NAMESPACE/deployment/dbmgmt               |
DB Mgmt proxy            | k8s   | $NAMESPACE/deployment/dbmgmt-oauth2-proxy  |
DB Mgmt UI               | http  | https://$DBMGMT_DOMAIN                      | expect=30x
Run Monitor              | k8s   | $NAMESPACE/deployment/monitor              |
Run Monitor proxy        | k8s   | $NAMESPACE/deployment/monitor-oauth2-proxy |
Run Monitor UI           | http  | https://$MONITOR_DOMAIN                     | expect=30x
Scheduler                | k8s   | $NAMESPACE/deployment/scheduler            |
Scheduler proxy          | k8s   | $NAMESPACE/deployment/scheduler-oauth2-proxy |
Scheduler UI             | http  | https://$SCHEDULER_DOMAIN                   | expect=30x
User Manager             | k8s   | $NAMESPACE/deployment/access               |
User Manager proxy       | k8s   | $NAMESPACE/deployment/access-oauth2-proxy  |
User Manager UI          | http  | https://$ACCESS_DOMAIN                      | expect=30x

# --- Portal ---
Portal                   | k8s   | $NAMESPACE/deployment/portal               |
Portal OAuth2 Proxy      | k8s   | $NAMESPACE/deployment/portal-oauth2-proxy  |
Portal UI                | http  | https://$PORTAL_DOMAIN                      | expect=30x

# --- AI Workbench (JupyterHub) ---
# Replaced the two Juju-based Kubeflow checks. An unauthenticated request is
# redirected to Keycloak, so 30x is the healthy answer.
AI Workbench             | http  | https://$WORKBENCH_DOMAIN                   | expect=30x

# --- Onboarding wizard (host service, apps/edge-wizard) ---
# Not a pod: a systemd --user unit, because flashing is over the host's USB.
# Unauthenticated requests are redirected to Keycloak, so 30x is healthy.
Onboarding wizard        | http  | http://$PLATFORM_IP:$EDGE_WIZARD_PORT/      | expect=30x
Onboarding wizard UI     | http  | https://$ONBOARD_DOMAIN                     | expect=30x
