# tests/k8s/iam-postgrest-nginx.yaml — the Config UI's nginx alone, for P16 of
# tests/iam-postgrest.sh: the image config-ui runs, with ConfigMap config-ui-nginx
# rendered from apps/frontend/k8s/config-ui-nginx-jwt.yaml into the throwaway
# namespace, so the test sends forged headers through exactly the production conf;
# and (R16) an echo stand-in for the scheduler behind its /scheduler-api/.
# Rendered with: render tests/k8s/iam-postgrest-nginx.yaml FIXTURE_NS
apiVersion: v1
kind: Pod
metadata:
  name: pgrst-nginx
  namespace: ${FIXTURE_NS}
  labels:
    app: iam-postgrest-nginx
spec:
  restartPolicy: Never
  containers:
    - name: nginx
      image: nginx:1.27-alpine
      ports:
        - {containerPort: 80, name: http}
      readinessProbe:
        tcpSocket: {port: 80}
        periodSeconds: 2
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 64Mi}
      volumeMounts:
        - {name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf}
  volumes:
    - {name: nginx-conf, configMap: {name: config-ui-nginx}}
---
# R16: a stand-in for the scheduler behind the nginx's /scheduler-api/ (Service
# scheduler, which the conf resolves per request). It answers every request with
# the method, path and headers it received, so the test sees what the Config UI's
# nginx forwards to the scheduler: the proxy's X-Forwarded-Access-Token must arrive
# (the scheduler's token check reads it). No secret is logged (no access log).
apiVersion: v1
kind: Pod
metadata:
  name: pgrst-scheduler-stub
  namespace: ${FIXTURE_NS}
  labels:
    app: iam-scheduler-stub
spec:
  restartPolicy: Never
  containers:
    - name: echo
      image: python:3.11-slim
      command: ["python3", "-u", "-c"]
      args:
        - |
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer
          class H(BaseHTTPRequestHandler):
              def _echo(self):
                  n = int(self.headers.get("Content-Length") or 0)
                  if n:
                      self.rfile.read(n)
                  body = json.dumps({"method": self.command, "path": self.path,
                                     "headers": {k.lower(): v for k, v in self.headers.items()}}).encode()
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)
              do_GET = do_PUT = do_POST = do_PATCH = do_DELETE = _echo
              def log_message(self, *a):
                  pass
          HTTPServer(("", 8080), H).serve_forever()
      ports:
        - {containerPort: 8080, name: http}
      readinessProbe:
        tcpSocket: {port: 8080}
        periodSeconds: 2
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 64Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: scheduler
  namespace: ${FIXTURE_NS}
spec:
  selector:
    app: iam-scheduler-stub
  ports:
    - {port: 80, targetPort: 8080}
